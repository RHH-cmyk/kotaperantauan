<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Isman: Kota Perantauan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#343a37;touch-action:none;font:13px/1.45 system-ui,Arial,sans-serif;color:#ece6d8}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#hud{position:fixed;left:10px;top:10px;z-index:5;max-width:min(360px,62vw);padding:10px;background:#17201ddd;border:1px solid #ffffff1f;border-radius:10px;pointer-events:none}
#hud b{color:#fff}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
.bar{font-size:11px}.bar div{height:5px;background:#0007;border-radius:3px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%}
#panel{position:fixed;right:10px;top:10px;bottom:10px;width:300px;z-index:6;overflow:auto;padding:10px;background:#17201df0;border:1px solid #ffffff26;border-radius:10px}
#pname{font-weight:bold;font-size:15px;margin-bottom:6px;color:#f4e3bd}
#ev{margin-bottom:8px}
.ev{background:#3a2f22;border:1px solid #d6b47b;border-radius:10px;padding:9px;margin-bottom:8px}
.ev p{margin:0 0 7px}
.acts{display:grid;gap:6px;margin-bottom:8px}
button{font:inherit;color:#ece6d8;background:#2e3632;border:1px solid #ffffff2a;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left}
button:disabled{opacity:.4;cursor:default}
button small{display:block;color:#b9b2a2;font-size:11px}
#log{margin-top:8px;border-top:1px solid #ffffff1a;padding-top:8px;font-size:12px;max-height:220px;overflow:auto}
#log p{margin:0 0 6px}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;border:3px solid #ffffff55;background:#1119;border-radius:50%;z-index:10;pointer-events:none;opacity:0;transform:translate(-50%,-50%);transition:opacity .3s}
#joy.visible{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;background:#b9b9b9c9}
#hint{position:fixed;left:10px;bottom:10px;z-index:5;font-size:11px;color:#fff9;background:#17201d99;padding:6px 8px;border-radius:6px;pointer-events:none}
@media (max-width:700px){
 #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-radius:12px 12px 0 0}
 #hud{max-width:calc(100% - 20px)}
 #hint{display:none}
}
</style>
</head>
<body>
<div id="hud"></div>
<div id="panel"><div id="pname"></div><div id="ev"></div><div class="acts" id="acts"></div><div id="log"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="hint">WASD / panah atau joystick. Dekati lokasi untuk melihat aksinya.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

/* ================= DATA GAME ================= */
const $=s=>document.querySelector(s);
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const clamp=v=>Math.max(0,Math.min(100,v));
const SL=['Pagi','Siang','Sore','Malam'];
let G;

const KOS=[
{n:'Kamar Petak Bu Sum',s:300000,r:50,st:3,h:-2,t:.10,d:'Lembap, sering bocor.'},
{n:'Kos Pinggir Rel',s:320000,r:60,st:5,h:0,t:.05,d:'Kereta lewat tiap jam.'},
{n:'Kos Atap Seng',s:400000,r:55,st:2,h:-1,t:.03,d:'Panas seperti oven.'},
{n:'Kos Melati',s:450000,r:75,st:1,h:0,t:.02,d:'Kecil tapi bersih.'},
{n:'Mushola Bu Ratna',s:500000,r:90,st:-2,h:1,t:0,d:'Ibu kos ramah.'}];
const EMP={n:'Emperan',r:20,st:6,h:-4,t:.15};
const JOBS=[
{id:'kb',n:'Kuli bangunan',sl:2,p:150000,e:35,h:8,b:0,ht:0,hl:1,s:4},
{id:'kp',n:'Kuli pasar',sl:1,p:70000,e:20,h:3,b:0,ht:0,hl:1,s:2},
{id:'cp',n:'Cuci piring warung',sl:1,p:55000,e:12,h:1,b:0,ht:0,hl:1,s:1,food:40},
{id:'lk',n:'Loper koran',sl:1,p:45000,e:10,h:1,b:0,ht:0,hl:1,s:0,only:0},
{id:'pb',n:'Buruh pabrik sepatu',sl:2,p:200000,e:40,h:4,b:1,ht:0,hl:2,s:3,need:1},
{id:'pl',n:'Parkir liar',sl:1,p:90000,e:15,h:1,b:-3,ht:10,hl:0,s:3},
{id:'rk',n:'Jualan rokok ketengan',sl:1,p:80000,e:12,h:1,b:-4,ht:8,hl:0,s:2},
{id:'pc',n:'Penagih bunga',sl:1,p:200000,e:15,h:0,b:-12,ht:5,hl:0,s:10},
{id:'kt',n:'Kurir titipan malam',sl:1,p:450000,e:30,h:2,b:-10,ht:25,hl:0,s:12,only:3,arrest:.2}];
const EV=[
{c:()=>G.uang>150000,t:'Dompet hampir dicopet di pasar. Separuh uangmu sudah hilang.',f:()=>{G.uang=Math.floor(G.uang/2);G.stress=clamp(G.stress+8)}},
{c:()=>G.kos===0,t:'Kamar Bu Sum banjir semalaman. Badan meriang.',f:()=>{G.health=clamp(G.health-6);G.uang=Math.max(0,G.uang-50000)}},
{c:()=>G.kos>=0&&G.kos!==4,t:'Demam tiba-tiba. Tubuhmu lemas.',f:()=>{G.health=clamp(G.health-8)}},
{c:()=>G.uang<250000&&G.pinjol===0,t:'Pak Dedi menawari pinjaman harian: Rp 500.000 cair hari ini, kembali Rp 600.000 dalam seminggu.',f:()=>{G.uang+=500000;G.pinjol=600000;G.pinjolDue=G.day+7}},
{c:()=>G.kos===4,t:'Bu Ratna mengajakmu makan malam bersama anak-anak kos.',f:()=>{G.hunger=clamp(G.hunger+40);G.stress=clamp(G.stress-8)}},
{c:()=>G.heat>=30,t:'Mobil polisi berhenti pelan di depan gang. Kamu pura-pura tidak melihat.',f:()=>{G.stress=clamp(G.stress+10)}},
{c:()=>G.hired,t:'Mandor memotong upah dengan alasan yang dibuat-buat.',f:()=>{G.uang=Math.max(0,G.uang-40000);G.batin=clamp(G.batin-1)}},
{c:()=>true,t:'Kabar dari kampung: ayah sakit lagi.',f:()=>{G.ayah=clamp(G.ayah-10);G.stress=clamp(G.stress+5)}},
{c:()=>!G.joko&&G.day>=4&&G.rep>=3,
 t:'Bang Joko menawari kerja cepat: antar titipan malam ini, Rp 500.000. Ia tidak mau bilang isinya apa.',
 ch:[
  {l:'Ambil pekerjaannya',r:'Paket tidak jelas isinya. Uang di tangan, tapi bahu terasa berat.',f:()=>{G.uang+=500000;G.heat=clamp(G.heat+15);G.batin=clamp(G.batin-8)}},
  {l:'Tolak dengan halus',r:'Joko mengangkat bahu. Terserah kamu, Bang.',f:()=>{G.rep=clamp(G.rep+2);G.batin=clamp(G.batin+3);G.stress=clamp(G.stress+3)}}]}
];

// Lokasi di dunia 3D: posisi x,z harus sama dengan bangunan yang dibuat di bawah.
const LOCS=[
{n:'Kos Kamar Bu Sum',t:'kos',a:0,x:-39,z:-30,v:0},
{n:'Kos Pinggir Rel',t:'kos',a:1,x:-43,z:28,v:2},
{n:'Kos Atap Seng',t:'kos',a:2,x:37,z:31,v:4},
{n:'Kos Melati',t:'kos',a:3,x:38,z:-34,v:1},
{n:'Mushola Bu Ratna',t:'kos',a:4,x:2,z:48,v:3},
{n:'Pasar',t:'job',j:['kp','cp','lk'],x:-28,z:2,v:5},
{n:'Area Proyek',t:'job',j:['kb','pb'],x:28,z:15,v:0},
{n:'Terminal',t:'job',j:['pl'],x:4,z:-49,v:2},
{n:'Gang Belakang',t:'job',j:['rk','pc','kt'],x:-18,z:8,v:4},
{n:'Bank Rakyat Perantau',t:'bank',x:18,z:31,v:1},
{n:'Warung Bu Tini',t:'warung',x:27,z:3,v:3},
{n:'Klinik Kecil',t:'klinik',x:-7,z:45,v:5},
{n:'Wartel',t:'wartel',x:12,z:-29,v:2},
{n:'Lowongan Kerja',t:'lowongan',x:42,z:3,v:0}];

function init(){
  G={day:1,slot:0,uang:950000,paid:0,denda:0,pinjol:0,pinjolDue:0,health:85,energy:90,hunger:70,stress:10,heat:0,batin:60,rep:5,kos:-1,hired:false,ayah:60,ayahGone:false,joko:false,over:null,pending:null,log:[]};
  L('Isman turun dari bus dengan uang Rp 950.000. Hutang Rp 50.000.000 harus lunas dalam setahun. Cari kos, lalu cari kerja.');
}
function L(t){G.log.push(t);if(G.log.length>60)G.log.shift();render()}
function owed(){return Math.max(0,50000000+G.denda+G.pinjol-G.paid)}
function bankOpen(){return G.slot<2&&G.day%7!==0}
function adv(n){for(let i=0;i<n;i++){if(G.over)return;G.slot++;if(G.slot>3){G.slot=0;nextDay()}}}

function nextDay(){
  if(G.over)return;
  G.day++;
  const k=G.kos>=0?KOS[G.kos]:EMP;
  G.hunger=clamp(G.hunger-15);
  G.energy=clamp(G.energy+k.r*(G.hunger>20?1:.5));
  G.health=clamp(G.health+2+(k.h||0)-(G.hunger<=0?3:0)-(G.stress>=80?4:0));
  G.stress=clamp(G.stress+k.st-3);
  G.heat=clamp(G.heat-6);
  G.ayah=clamp(G.ayah-1);
  if(G.ayah<=0&&!G.ayahGone){G.ayahGone=true;G.stress=clamp(G.stress+30);L('Kabar dari kampung: ayah tidak tertolong.')}
  if(G.uang>0&&Math.random()<k.t){const d=Math.min(G.uang,50000);G.uang-=d;L('Ada yang menyelinap ke kamarmu. '+rp(d)+' hilang.')}
  if(G.kos>=0&&(G.day-1)%30===0){
    const s=KOS[G.kos].s;
    if(G.uang>=s){G.uang-=s;L('Sewa kos bulan ini sudah dibayar.')}
    else{const kurang=s-G.uang;G.denda+=kurang;G.uang=0;G.stress=clamp(G.stress+15);L('Sewa kurang '+rp(kurang)+', dicatat sebagai tunggakan.')}
  }
  if(G.day>1&&(G.day-1)%30===0){
    const req=4200000*((G.day-1)/30);
    if(G.paid<req){const s=req-G.paid;G.denda+=Math.round(s*.1);G.stress=clamp(G.stress+15);L('Setoran kurang '+rp(s)+'. Bunga 10% ditambahkan. Penagih datang ke kos.')}
    else L('Setoran bulan ini sudah sesuai target.');
  }
  if(G.pinjol>0&&G.day>=G.pinjolDue){
    const bayar=Math.min(G.uang,G.pinjol);G.uang-=bayar;G.pinjol-=bayar;
    if(G.pinjol>0){G.pinjol=Math.round(G.pinjol*1.2);G.pinjolDue=G.day+7;G.stress=clamp(G.stress+15);L('Pinjaman harian menunggak. Bunganya membengkak.')}
    else L('Pinjaman harian lunas.');
  }
  if(G.health<=0){G.over='dead';render();return}
  if(G.heat>=50&&Math.random()<.3){jail();if(G.over)return}
  if(owed()<=0){G.over='win';render();return}
  if(G.day>365){G.over='time';render();return}
  maybeEvent();
}
function maybeEvent(){
  if(G.pending||Math.random()>.5)return;
  const pool=EV.filter(e=>e.c());
  if(!pool.length)return;
  const e=pool[Math.floor(Math.random()*pool.length)];
  if(e.ch){G.joko=true;G.pending=e;render()}else{L(e.t);e.f()}
}
function pick(i){const e=G.pending;if(!e)return;G.pending=null;const c=e.ch[i];c.f();L(c.r)}
function jail(){
  G.heat=0;G.stress=clamp(G.stress+25);G.batin=clamp(G.batin-5);
  const d=Math.min(G.uang,300000);G.uang-=d;G.slot=0;
  L('Ditangkap razia. Denda '+rp(d)+'. Tiga hari hilang di balik jeruji.');
  for(let i=0;i<3&&!G.over;i++)nextDay();
}
function job(id){
  const j=JOBS.find(x=>x.id===id);
  if(j.only!=null&&G.slot!==j.only)return L(j.n+' hanya bisa '+SL[j.only].toLowerCase()+'.');
  if(j.need&&!G.hired)return L('Belum diterima kerja di pabrik.');
  if(j.sl===2&&G.slot===3)return L('Sudah malam, tidak cukup waktu.');
  if(G.energy<j.e)return L('Energi habis. Tidur dulu.');
  if(j.ht>0&&Math.random()<(j.arrest||0)+G.heat/300)return jail();
  G.uang+=j.p;G.energy=clamp(G.energy-j.e);G.health=clamp(G.health-j.h);
  G.hunger=clamp(G.hunger-6*j.sl+(j.food||0));G.stress=clamp(G.stress+j.s);
  G.batin=clamp(G.batin+j.b);G.heat=clamp(G.heat+j.ht);G.rep=clamp(G.rep+j.hl);
  L(j.n+': dapat '+rp(j.p)+'.');adv(j.sl);
}
function sewa(i){
  const c=2*KOS[i].s;
  if(G.uang<c)return L('Uang kurang. Butuh '+rp(c)+' untuk deposit dan sewa pertama.');
  G.uang-=c;G.kos=i;L('Pindah ke '+KOS[i].n+'. '+KOS[i].d);adv(1);
}
function tidur(){if(G.pending)return;L('Isman merebahkan diri. Hari berakhir.');G.slot=3;adv(1)}
function setor(n){
  if(!bankOpen())return L('Bank tutup sekarang.');
  const a=Math.min(G.uang,n);if(a<=0)return L('Tidak ada uang untuk disetor.');
  G.uang-=a;G.paid+=a;L('Setor '+rp(a)+'. Sisa hutang '+rp(owed())+'.');adv(1);
  if(owed()<=0&&!G.over)G.over='win';
}
function makan(p,h){if(G.uang<p)return L('Uang tidak cukup.');G.uang-=p;G.hunger=clamp(G.hunger+h);L('Makan. Perut sedikit terisi.');adv(1)}
function klinik(p,h){if(G.uang<p)return L('Uang tidak cukup.');G.uang-=p;G.health=clamp(G.health+h);L('Berobat. Badan terasa lebih ringan.');adv(1)}
function telepon(){if(G.uang<5000)return L('Pulsa habis.');G.uang-=5000;G.stress=clamp(G.stress-8);G.ayah=clamp(G.ayah+5);L('Ayah bicara pelan. Suaranya lebih lemah dari yang Isman ingat.');adv(1)}
function kirim(){if(G.uang<300000)return L('Uang tidak cukup.');G.uang-=300000;G.ayah=clamp(G.ayah+15);L('Rp 300.000 dikirim untuk obat ayah. Tidak masuk hitungan hutang.');adv(1)}
function lamar(){
  if(G.hired)return L('Kamu sudah diterima.');
  if(G.rep<10)return L('Ditolak. Reputasi belum cukup. Kerja yang jujur dulu.');
  G.hired=true;L('Diterima kerja di pabrik sepatu.');adv(1);
}
// Dipanggil dari tombol panel. Fungsi global agar onclick bisa memanggilnya.
Object.assign(window,{job,sewa,tidur,setor,makan,klinik,telepon,kirim,lamar,pick});

function endText(){
  let t;
  if(G.over==='dead')t='Isman ditemukan tak bernyawa di kamar kosnya. Hutang ayahnya tetap ada, kini tanpa siapa pun yang bekerja untuknya.';
  else if(G.over==='win')t=G.batin>=50?'Hutang lunas dengan tangan yang masih bersih. Isman pulang, dan ayahnya memeluknya tanpa bertanya apa-apa.':'Hutang lunas. Tapi uang itu datang dari tempat yang tidak ingin Isman ingat, dan ia pulang sebagai orang yang berbeda.';
  else t='Setahun habis. Sisa hutang masih ada, dan Isman pulang dengan tangan kosong.';
  if(G.ayahGone)t+=' Ayahnya sudah tiada saat Isman sampai di kampung.';
  return t;
}
function actsFor(l){
  const dis0=!!(G.pending||G.over);
  const b=(t,s,fn,dis)=>'<button '+((dis||dis0)?'disabled':'')+' onclick="'+fn+'"><span>'+t+'<small>'+s+'</small></span></button>';
  switch(l.t){
    case 'kos':return b(G.kos===l.a?'Sudah tinggal di sini':'Sewa / pindah ke sini',rp(KOS[l.a].s)+'/bulan, deposit 2x. '+KOS[l.a].d,'sewa('+l.a+')',G.kos===l.a);
    case 'job':return l.j.map(id=>{const j=JOBS.find(x=>x.id===id);return b(j.n,rp(j.p)+' · '+j.sl+' slot · energi -'+j.e+(j.only!=null?' · hanya '+SL[j.only].toLowerCase():'')+(j.ht?' · berisiko':''),"job('"+id+"')")}).join('');
    case 'bank':{const note=G.slot>=2?'Bank tutup sore ini':G.day%7===0?'Bank tutup hari Minggu':'Buka pagi dan siang';const d=!bankOpen();
      return b('Setor Rp 100.000',note,'setor(100000)',d)+b('Setor Rp 500.000',note,'setor(500000)',d)+b('Setor Rp 1.000.000',note,'setor(1000000)',d)+b('Setor semua uang',note,'setor(Infinity)',d)}
    case 'warung':return b('Nasi telur','Rp 12.000, kenyang sedikit','makan(12000,35)')+b('Nasi lengkap','Rp 25.000, kenyang banyak','makan(25000,60)');
    case 'klinik':return b('Periksa dokter','Rp 150.000, kesehatan +30','klinik(150000,30)')+b('Obat murah','Rp 30.000, kesehatan +10','klinik(30000,10)');
    case 'wartel':return b('Telepon ayah','Rp 5.000, stres turun','telepon()')+b('Kirim Rp 300.000 ke kampung','Untuk obat ayah, tidak mengurangi hutang','kirim()');
    case 'lowongan':return b(G.hired?'Sudah diterima di pabrik':'Lamar pabrik sepatu','Butuh reputasi 10. Sekarang: '+G.rep,'lamar()',G.hired);
  }
  return '';
}
let panelKey='';
function panel(force){
  const near=nearest();
  const key=(near?near.n:'-')+G.day+G.slot+G.pending+G.over+G.uang+G.log.length;
  if(!force&&key===panelKey)return;panelKey=key;
  $('#pname').textContent=near?near.n:'Jelajahi kota';
  if(G.over){$('#ev').innerHTML='<div class="ev"><p>'+endText()+'</p><button onclick="location.reload()">Main lagi</button></div>';$('#acts').innerHTML='';}
  else if(G.pending){$('#ev').innerHTML='<div class="ev"><p>'+G.pending.t+'</p><div class="acts">'+G.pending.ch.map((c,i)=>'<button onclick="pick('+i+')">'+c.l+'</button>').join('')+'</div></div>';$('#acts').innerHTML='';}
  else{$('#ev').innerHTML='';
    $('#acts').innerHTML=(near?actsFor(near):'<p style="color:#b9b2a2">Dekati kos, pasar, bank, atau warung untuk melihat aksi.</p>')+'<button '+(G.pending||G.over?'disabled':'')+' onclick="tidur()">Tidur (akhiri hari)<small>Hari berganti saat malam berakhir.</small></button>';}
  $('#log').innerHTML=G.log.slice().reverse().map(x=>'<p>'+x+'</p>').join('');
}
function render(){
  const bar=(n,v,c)=>'<div class="bar">'+n+' '+Math.round(v)+'<div><i style="width:'+v+'%;background:'+c+'"></i></div></div>';
  $('#hud').innerHTML='<b>Hari '+G.day+'/365</b> · '+SL[G.slot]+' · Kos: '+(G.kos>=0?KOS[G.kos].n:'belum ada')+'<br>Uang <b>'+rp(G.uang)+'</b> · Sisa hutang <b>'+rp(owed())+'</b>'+(G.pinjol?' · Pinjol '+rp(G.pinjol):'')+
    '<div class="bars">'+bar('Kesehatan',G.health,'#7bbf6a')+bar('Energi',G.energy,'#6aa7d6')+bar('Kenyang',G.hunger,'#d6a06a')+bar('Stres',G.stress,'#c76a6a')+bar('Razia',G.heat,'#c9645e')+bar('Batin',G.batin,'#b9a3d6')+bar('Reputasi',G.rep,'#d6b47b')+'</div>';
  panel(true);
}

/* ================= 3D ================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color('#73766b');scene.fog=new THREE.Fog('#73766b',70,140);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,300);camera.position.set(10,13,12);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe8c8,0x393b35,2.0));
const sun=new THREE.DirectionalLight(0xffd9a2,2.0);sun.position.set(-12,22,8);scene.add(sun);

const manager=new THREE.LoadingManager();
manager.setURLModifier(url=>{const clean=decodeURIComponent(url.split('?')[0]);if(/\.(png|jpe?g|webp)$/i.test(clean))return './assets/models/textures/'+clean.split('/').pop();return url});
const loader=new GLTFLoader(manager),base='./assets/models/';
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const M={earth:mat('#6d705c'),asphalt:mat('#373a37'),curb:mat('#b0a58e')};
const obstacles=[];
function block(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function obstacle(x,z,w,d){obstacles.push({x,z,w,d})}

// Tanah dan jalan utama
block(160,.3,160,0,-.42,0,M.earth);
block(120,.16,8,0,-.12,0,M.asphalt);
block(8,.16,120,0,-.12,0,M.asphalt);
for(let x=-52;x<=52;x+=5.5)block(1.9,.025,.13,x,-.008,0,M.curb);
for(let z=-52;z<=52;z+=5.5)block(.13,.025,1.9,0,-.018,z,M.curb);

// Aset GLB: skala tinggi, letakkan dasarnya di y
function addAsset(file,x,y,z,height,rot=0,collide=null,folder=''){
  loader.load(base+folder+file,g=>{
    const o=g.scene;let b=new THREE.Box3().setFromObject(o);const sz=b.getSize(new THREE.Vector3());
    if(sz.y<.0001)return;
    o.scale.setScalar(height/sz.y);o.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(o);
    o.position.set(x,y-b.min.y,z);o.rotation.y=rot;scene.add(o);
    if(collide)obstacle(x,z,collide[0],collide[1]);
  },undefined,()=>{});
}
// Bangunan permukiman dari panel dinding dan atap GLB asli
const WALLS=['wall-a-flat.glb','wall-a-flat-painted.glb','wall-b-flat.glb','wall-a-flat-window.glb','wall-b-flat-window.glb'];
const ROOFS=['wall-a-roof.glb','wall-a-roof-detailed.glb','wall-b-roof.glb','roof-metal-type-a.glb','roof-metal-type-b.glb'];
function building(x,z,w,d,h,v){
  const front=z<0?1:-1,n=Math.max(2,Math.round(w/1.7)),m=Math.max(2,Math.round(d/1.7));
  for(let i=0;i<n;i++){
    addAsset(WALLS[(v+i)%WALLS.length],x-w/2+w/n*(i+.5),0,z+front*d/2,h,front===1?0:Math.PI);
    addAsset(WALLS[(v+i+2)%WALLS.length],x-w/2+w/n*(i+.5),0,z-front*d/2,h,front===1?Math.PI:0);
  }
  for(let i=0;i<m;i++)for(const s of[-1,1])addAsset(WALLS[(v+i+s+3)%WALLS.length],x+s*w/2,0,z-d/2+d/m*(i+.5),h,s===1?Math.PI/2:-Math.PI/2);
  addAsset(ROOFS[v%ROOFS.length],x,h*.9,z,h*.5,(v%2)*Math.PI/2);
  obstacle(x,z,w*.8,d*.8);
}
function signTex(title,sub){
  const c=document.createElement('canvas');c.width=512;c.height=140;const x=c.getContext('2d');
  x.fillStyle='#3c3026';x.fillRect(0,0,512,140);x.fillStyle='#d8c39a';x.fillRect(7,7,498,126);
  x.fillStyle='#292820';x.font='bold 38px Arial';x.textAlign='center';x.fillText(title,256,68);
  x.font='24px Arial';x.fillText(sub,256,108);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function sign(title,sub,x,z,y){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(4.6,1.25,.14),new THREE.MeshStandardMaterial({map:signTex(title,sub),roughness:1}));
  b.position.y=2.4;g.add(b);
  for(const px of[-1.8,1.8]){const p=new THREE.Mesh(new THREE.BoxGeometry(.14,2.4,.14),mat('#554435'));p.position.set(px,1.2,0);g.add(p)}
  g.position.set(x,0,z);scene.add(g);
}

// Bangun setiap lokasi, lalu beri papan namanya
for(const L0 of LOCS){
  const isKos=L0.t==='kos';
  const w=isKos?5.8:6.5,d=isKos?4.8:5.2,h=isKos?2.9:3.2;
  building(L0.x,L0.z,w,d,h,L0.v);
  sign(L0.n,isKos?rp(KOS[L0.a].s)+'/bln':'',L0.x,L0.z+(L0.z>0?-1:1)*(d/2+1.1),0);
  if(!isKos)addAsset('detail-awning-wide.glb',L0.x,0,L0.z+(L0.z>0?-1:1)*(d/2+.45),.8,L0.z>0?Math.PI:0);
  else addAsset('detail-dumpster-closed.glb',L0.x-w*.6,0,L0.z+.8,.85,0,[.8,.65]);
}
// Dekorasi jalan: lampu, tong sampah, tumpukan palet, truk tua
for(const [x,z] of[[-33,18],[-11,-25],[25,-17],[50,22],[0,38],[-50,-8],[18,48]]){
  addAsset('detail-light-single.glb',x,0,z,3,0,[.3,.3]);
  addAsset('detail-dumpster-open.glb',x+1.4,0,z+.7,1.05,Math.random()*2,[1,.8]);
}
addAsset('truck-grey.glb',-8.8,0,-.7,2.25,Math.PI/2,[3.8,2]);
addAsset('truck-green.glb',9.2,0,1,2.15,-Math.PI/2,[3.8,2]);
for(let x=-54;x<=54;x+=9){addAsset('tree-shrub.glb',x,0,9.5,1.4,x,null);addAsset('tree-small.glb',x+4,0,-9.5,2.2,x,null)}
for(let i=0;i<14;i++){addAsset('pallet-small.glb',-50+i*7.5,0,4.5+(i%2)*2,.5,i,null);}

// Isman
let character=null,mixer=null,walkA=null,idleA=null,activeA=null;const clock=new THREE.Clock();
function loadIsman(i=0){
  const paths=['./assets/models/character/Isman.glb','./assets/models/Isman.glb'];
  if(i>=paths.length){$('#hint').textContent='Isman gagal dimuat. Pastikan folder assets ada dan dibuka lewat server lokal.';return}
  loader.load(paths[i],g=>{
    character=g.scene;
    let b=new THREE.Box3().setFromObject(character);const sz=b.getSize(new THREE.Vector3());
    if(sz.y>0)character.scale.setScalar(1.72/sz.y);
    character.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(character);
    character.position.set(0,-b.min.y,0);scene.add(character);
    mixer=new THREE.AnimationMixer(character);
    const clips=g.animations||[];
    const wc=clips.find(c=>/\|(Run|Walk)$/i.test(c.name))||clips.find(c=>/run|walk/i.test(c.name));
    const ic=clips.find(c=>/\|Idle$/i.test(c.name))||clips.find(c=>/idle/i.test(c.name));
    if(wc)walkA=mixer.clipAction(wc);if(ic)idleA=mixer.clipAction(ic);
    activeA=idleA||walkA;if(activeA)activeA.play();
  },undefined,()=>loadIsman(i+1));
}
loadIsman();

/* ================= INPUT ================= */
const keys={};let jx=0,jy=0,active=false,pid=null,fadeT=null;
const joy=$('#joy'),knob=$('#knob');const STICK=49;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('#panel,#hud'))return;
  if(active)return;e.preventDefault();active=true;pid=e.pointerId;
  joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.classList.add('visible');clearTimeout(fadeT);jx=jy=0;
});
document.addEventListener('pointermove',e=>{
  if(!active||e.pointerId!==pid)return;
  let dx=e.clientX-parseFloat(joy.style.left),dy=e.clientY-parseFloat(joy.style.top);
  const l=Math.hypot(dx,dy);if(l>STICK){dx*=STICK/l;dy*=STICK/l}
  jx=dx/STICK;jy=dy/STICK;knob.style.left=(50+dx/1.2)+'%';knob.style.top=(50+dy/1.2)+'%';
});
function release(){active=false;pid=null;jx=jy=0;knob.style.left='50%';knob.style.top='50%';fadeT=setTimeout(()=>joy.classList.remove('visible'),800)}
document.addEventListener('pointerup',e=>{if(active&&e.pointerId===pid)release()});
document.addEventListener('pointercancel',e=>{if(active&&e.pointerId===pid)release()});

/* ================= LOOP ================= */
function collides(x,z){for(const o of obstacles)if(Math.abs(x-o.x)<o.w/2+.3&&Math.abs(z-o.z)<o.d/2+.3)return true;return false}
function nearest(){
  if(!character)return null;let best=null,bd=7;
  for(const l of LOCS){const d=Math.hypot(character.position.x-l.x,character.position.z-l.z);if(d<bd){bd=d;best=l}}
  return best;
}
const target=new THREE.Vector3();
let lastNear=null;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(mixer)mixer.update(dt);
  if(character){
    let dx=jx,dz=jy;
    if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
    if(keys['w']||keys['arrowup'])dz-=1;if(keys['s']||keys['arrowdown'])dz+=1;
    const moving=Math.hypot(dx,dz)>.15;
    if(moving){
      const l=Math.hypot(dx,dz);dx/=Math.max(1,l);dz/=Math.max(1,l);
      const sp=3.3,nx=THREE.MathUtils.clamp(character.position.x+dx*sp*dt,-62,62),nz=THREE.MathUtils.clamp(character.position.z+dz*sp*dt,-58,58);
      if(!collides(nx,character.position.z))character.position.x=nx;
      if(!collides(character.position.x,nz))character.position.z=nz;
      character.rotation.y=Math.atan2(dx,dz);
      if(walkA&&activeA!==walkA){if(activeA)activeA.fadeOut(.12);walkA.reset().fadeIn(.12).play();activeA=walkA}
    }else if(idleA&&activeA!==idleA){if(activeA)activeA.fadeOut(.12);idleA.reset().fadeIn(.12).play();activeA=idleA}
    target.set(character.position.x,0,character.position.z);
    const desired=new THREE.Vector3(target.x+8,11,target.z+9.5);
    camera.position.lerp(desired,.09);camera.lookAt(target);
    const nr=nearest();
    if(nr!==lastNear){lastNear=nr;panel(true)}
  }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

init();render();animate();
</script>
