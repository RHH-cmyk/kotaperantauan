<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kota Perantauan 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background-color: #000; color: #e2e8f0; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; user-select: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b0f14; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }
        
        .screen-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #main-menu { z-index: 50; background: rgba(11, 15, 20, 0.95); }
        .game-title { font-family: 'Press Start 2P', cursive; font-size: clamp(1.2rem, 4vw, 2.5rem); color: #fbbf24; text-shadow: 4px 4px 0 #92400e; margin-bottom: 2rem; text-align: center; line-height: 1.5; }
        .btn-menu { background: linear-gradient(to bottom, #3b82f6, #2563eb); border: 4px solid #93c5fd; color: white; font-family: 'Press Start 2P', cursive; font-size: 1rem; padding: 1rem 2rem; border-radius: 12px; cursor: pointer; box-shadow: 0 8px 0 #1e3a8a; margin: 10px; transition: transform 0.1s; }
        .btn-menu:active { transform: translateY(8px); box-shadow: 0 0 0 #1e3a8a; }

        #loading-screen { z-index: 60; display: none; background: #0b0f14; }
        .loading-text { font-family: 'Press Start 2P', cursive; font-size: 1.2rem; color: #38bdf8; margin-bottom: 1rem; text-align: center; }
        #loading-detail { color: #94a3b8; font-size: 0.8rem; margin-top: 10px; font-family: 'Press Start 2P', cursive; text-align: center;}

        #hud { z-index: 10; display: none; background: transparent; pointer-events: none; }
        
        .top-bar { width: 100%; display: flex; justify-content: space-between; padding: 15px; pointer-events: auto; position: absolute; top: 0; left: 0;}
        .hud-panel { background: rgba(15,23,42,0.8); border: 2px solid rgba(71,85,105,0.8); padding: 10px 15px; border-radius: 12px; backdrop-filter: blur(4px); }
        .hud-stats { display: flex; flex-direction: column; gap: 10px; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: white; }
        .stat-row { display: flex; align-items: center; gap: 10px; }
        .bar-bg { width: 80px; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; border: 1px solid #000; }
        .bar-fill { height: 100%; transition: width 0.3s; }
        #energy-bar { background: #facc15; }
        #mood-bar { background: #38bdf8; }
        
        .hud-time { text-align: right; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; }
        .hud-debt { color: #ef4444; margin-top: 8px; }

        .controls-area { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2rem; pointer-events: none; position: absolute; bottom: 40px; left: 0;}
        .joystick-base { width: 180px; height: 180px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .joystick-stick { width: 85px; height: 85px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}

        .btn-action { width: 100px; height: 100px; background: linear-gradient(135deg, #ef4444, #b91c1c); border: 4px solid #fca5a5; border-radius: 50%; color: white; font-family: 'Press Start 2P', cursive; font-size: 0.8rem; display: flex; justify-content: center; align-items: center; pointer-events: auto; box-shadow: 0 6px 0 #7f1d1d; transition: transform 0.1s; }
        .btn-action:active:not(.disabled) { transform: translateY(6px); box-shadow: 0 0 0 #7f1d1d; }
        .btn-action.disabled { filter: grayscale(1); opacity: 0.4; pointer-events: none; }

        #modal-ui { z-index: 100; display: none; background: rgba(0,0,0,0.85); }
        .modal-box { background: #1e293b; border: 4px solid #cbd5e1; border-radius: 16px; padding: 1.5rem; max-width: 90%; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8);}
        .modal-title { font-family: 'Press Start 2P', cursive; font-size: 1rem; color: #fbbf24; margin-bottom: 1rem; }
        .modal-desc { font-size: 0.9rem; margin-bottom: 1.5rem; color: #e2e8f0; white-space: pre-wrap; line-height: 1.5; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;}
        .btn-generic { background: #3b82f6; color: white; border: 2px solid #93c5fd; padding: 0.8rem 1.2rem; border-radius: 8px; font-family: 'Press Start 2P', cursive; font-size: 0.8rem; cursor: pointer; }
        .btn-cancel { background: #ef4444; border-color: #fca5a5; }
        
        #toast { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); background: rgba(30,58,138,0.95); border: 2px solid #60a5fa; padding: 10px 20px; border-radius: 8px; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; z-index: 80; opacity: 0; transition: opacity 0.3s; color: white; pointer-events: none; text-align: center;}
        
        #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: hidden; }
        .bldg-label { position: absolute; background: rgba(15, 23, 42, 0.85); border: 1px solid #64748b; color: #fbbf24; padding: 6px 10px; border-radius: 6px; font-family: 'Press Start 2P', cursive; font-size: 0.55rem; transform: translate(-50%, -100%); transition: opacity 0.2s; text-shadow: 2px 2px 0px #000; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .bldg-label span { color: #cbd5e1; font-size: 0.45rem; }
        #fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.6s ease-in-out; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="webgl-canvas"></canvas>

        <div id="labels-container"></div>
        <div id="fade-overlay"></div>

        <div id="main-menu" class="screen-layer">
            <div class="game-title">KOTA PERANTAUAN 3D</div>
            <div style="color: #64748b; margin-bottom: 2rem; font-family: 'Press Start 2P'; font-size: 0.8rem;">Dense Slum Edition V1.2</div>
            <button class="btn-menu" onclick="startLoading()">Mulai Perantauan</button>
            <button class="btn-menu" style="background: #475569; border-color: #94a3b8;" onclick="toggleFullScreen()">Full Screen</button>
        </div>

        <div id="loading-screen" class="screen-layer">
            <div class="loading-text">MEMASUKI KOTA...</div>
            <div id="loading-progress" style="font-family: 'Press Start 2P'; font-size: 2rem; color: #fbbf24;">0%</div>
            <div id="loading-detail">Menyiapkan aset...</div>
        </div>

        <div id="hud" class="screen-layer">
            <div class="top-bar">
                <div class="hud-panel hud-stats">
                    <div class="stat-row">💰 <span id="ui-money">Rp 1.000.000</span></div>
                    <div class="stat-row">⚡ <div class="bar-bg"><div id="energy-bar" class="bar-fill" style="width: 100%;"></div></div></div>
                    <div class="stat-row">😊 <div class="bar-bg"><div id="mood-bar" class="bar-fill" style="width: 100%;"></div></div></div>
                </div>
                <div class="hud-panel hud-time">
                    <div style="color: #fbbf24; margin-bottom: 8px;">HARI <span id="ui-day">1</span>/365</div>
                    <div id="ui-clock" style="font-size: 1rem; margin-bottom: 8px;">08:00</div>
                    <div class="hud-debt">UTANG: <span id="ui-debt">Rp 50 Juta</span></div>
                </div>
            </div>

            <div class="controls-area">
                <div class="joystick-base" id="joystick-zone">
                    <div class="joystick-stick" id="joystick-stick"></div>
                </div>
                <div class="btn-action disabled" id="btn-action">AKSI</div>
            </div>
        </div>

        <div id="toast">Notifikasi</div>

        <div id="modal-ui" class="screen-layer">
            <div class="modal-box">
                <div class="modal-title" id="modal-title">Judul</div>
                <div class="modal-desc" id="modal-desc">Deskripsi...</div>
                <div class="modal-buttons" id="modal-buttons"></div>
            </div>
        </div>
    </div>

    <script>
        const gameState = {
            isPlaying: false, money: 1000000, debt: 50000000, energy: 100, mood: 100,
            day: 1, inGameMinutes: 8 * 60,
            kostRented: false, rentDaysLeft: 0, currentScene: 'kost'
        };

        let scene, camera, renderer, clock, mixer;
        let ismanMesh = null;
        let characterActions = {}; 
        let activeAction = null;
        let interactZones = [];
        let activeInteractTarget = null;
        
        let envGroup = null; // Penampung objek map agar bisa dihapus saat pindah scene
        let globalModels = {}; // Menyimpan memori aset yang sudah didownload
        let uiLabels = []; // Data untuk label bangunan
        
        const joystick = { active: false, x: 0, y: 0, touchId: null };

        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }
        function formatRp(amount) { return "Rp " + amount.toLocaleString('id-ID'); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }

        function startLoading() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';
            initThreeEngine();
        }

        function initThreeEngine() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            
            scene.background = new THREE.Color(0x0a0c10); 
            scene.fog = new THREE.FogExp2(0x0a0c10, 0.04); // Kabut tebal industri

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // MAGIC TRICK: Menekan kecerahan warna aset agar kusam dan serius
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.55; 

            const ambientLight = new THREE.AmbientLight(0x4a5b6e, 1.5); // Cahaya biru muram
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0x8296a8, 1.0); 
            sun.position.set(15, 30, -10);
            sun.castShadow = true;
            sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
            sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
            scene.add(sun);

            // Lantai Dasar Aspal Kusam
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x11151a, roughness: 1.0 }); 
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            clock = new THREE.Clock();
            loadAssets();
        }

        function loadAssets() {
            const loader = new THREE.GLTFLoader();
            
            const assetsToLoad = [
                { id: 'player', path: 'assets/models/Isman.glb' },
                { id: 'path', path: 'assets/models/path-long.glb' },
                { id: 'path_short', path: 'assets/models/path-short.glb' },
                { id: 'fence', path: 'assets/models/fence.glb' },
                { id: 'tree1', path: 'assets/models/tree-large.glb' },
                { id: 'b_kost', path: 'assets/models/building-type-i.glb', job: 'kost', name: 'Kost Triplek', desc: 'Area Istirahat' },
                { id: 'b_mart', path: 'assets/models/building-type-j.glb', job: 'minimarket', name: 'Mini Mart', desc: 'Gaji: 75rb/Shift' },
                { id: 'b_office', path: 'assets/models/building-type-k.glb', job: 'bank', name: 'Bank Pusat', desc: 'Bayar Utang' },
                { id: 'b_house1', path: 'assets/models/building-type-a.glb', job: 'none' },
                { id: 'b_house2', path: 'assets/models/building-type-c.glb', job: 'none' }
            ];

            let loadedCount = 0;

            assetsToLoad.forEach(asset => {
                document.getElementById('loading-detail').innerText = `Memuat: ${asset.path}`;
                
                loader.load(asset.path, (gltf) => {
                    const model = gltf.scene;
                    model.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; }});
                    
                    if(asset.id === 'player') {
                        ismanMesh = model;
                        ismanMesh.scale.set(0.8, 0.8, 0.8); 
                        scene.add(ismanMesh);
                        
                        if(gltf.animations && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(ismanMesh);
                            let findIdle = null; let findWalk = null;
                            
                            gltf.animations.forEach(clip => {
                                const clipName = clip.name.toLowerCase();
                                // Mencari animasi idle dan run/walk dengan spesifik
                                if(clipName.includes('idle')) findIdle = mixer.clipAction(clip);
                                if(clipName.includes('walk') || clipName.includes('run')) findWalk = mixer.clipAction(clip);
                            });

                            characterActions['idle'] = findIdle || mixer.clipAction(gltf.animations[0]);
                            characterActions['walk'] = findWalk || characterActions['idle'];
                            
                            activeAction = characterActions['idle'];
                            activeAction.play();
                        }
                    } else {
                        globalModels[asset.id] = { model: model, data: asset };
                    }

                    loadedCount++;
                    document.getElementById('loading-progress').innerText = Math.floor((loadedCount / assetsToLoad.length) * 100) + '%';
                    
                    if(loadedCount === assetsToLoad.length) {
                        // Jalankan Scene Pertama!
                        changeScene('kost', 0, 10);
                        setTimeout(startGame, 500);
                    }
                }, undefined, (e) => { loadedCount++; if(loadedCount === assetsToLoad.length) setTimeout(startGame, 500); });
            });
        }

        function changeScene(sceneName, spawnX, spawnZ) {
            const fade = document.getElementById('fade-overlay');
            fade.style.opacity = 1; // Gelapkan layar
            
            setTimeout(() => {
                if(envGroup) { scene.remove(envGroup); }
                envGroup = new THREE.Group();
                scene.add(envGroup);
                
                interactZones = [];
                uiLabels = [];
                document.getElementById('labels-container').innerHTML = '';
                
                ismanMesh.position.set(spawnX, 0, spawnZ);
                gameState.currentScene = sceneName;
                
                buildScene(sceneName); // Rakit map baru
                
                setTimeout(() => { fade.style.opacity = 0; }, 400); // Terangkan layar
            }, 600);
        }

        function buildScene(sceneName) {
            if(sceneName === 'kost') {
                // 1. SCENE GANG KOST (Sempit, Linear)
                for(let z = -20; z <= 20; z+=4) {
                    if(globalModels['path']) {
                        let p = globalModels['path'].model.clone(); p.position.set(0, 0, z); envGroup.add(p);
                    }
                    // Tembok Rapat di kiri jalan
                    if(globalModels['b_house1'] && z > -15) {
                        let b = globalModels['b_house1'].model.clone(); 
                        b.scale.set(2,2,2); b.position.set(-3.5, 0, z); b.rotation.y = Math.PI/2; envGroup.add(b);
                    }
                }
                // Bangunan Kost di ujung jalan
                if(globalModels['b_kost']) {
                    let k = globalModels['b_kost'].model.clone();
                    k.scale.set(2.5, 2.5, 2.5); k.position.set(3.5, 0, -10); k.rotation.y = -Math.PI/2; envGroup.add(k);
                    
                    interactZones.push({ x: 3.5, z: -10, radius: 4, type: 'kost' });
                    addLabel(3.5, 6, -10, "KOST BAPAK", "Istirahat");
                }
                // Titik Pindah Map (Area Bawah)
                interactZones.push({ x: 0, z: 20, radius: 5, type: 'transit_kota' });
                addLabel(0, 2, 20, "KE PUSAT KOTA", "Jalan Raya");

            } else if (sceneName === 'kota') {
                // 2. SCENE PUSAT KOTA (Persimpangan Lebar)
                for(let z = -20; z <= 20; z+=4) {
                    if(globalModels['path']) {
                        let p = globalModels['path'].model.clone(); p.position.set(0, 0, z); p.scale.set(2,1,1); envGroup.add(p); // Jalan Utama
                    }
                }
                
                if(globalModels['b_mart']) {
                    let m = globalModels['b_mart'].model.clone();
                    m.scale.set(3,3,3); m.position.set(-6, 0, -5); m.rotation.y = Math.PI/2; envGroup.add(m);
                    interactZones.push({ x: -6, z: -5, radius: 5, type: 'minimarket' });
                    addLabel(-6, 8, -5, "MINIMARKET", "Lowongan Shift");
                }
                if(globalModels['b_office']) {
                    let o = globalModels['b_office'].model.clone();
                    o.scale.set(3,4,3); o.position.set(6, 0, -10); o.rotation.y = -Math.PI/2; envGroup.add(o);
                    interactZones.push({ x: 6, z: -10, radius: 5, type: 'bank' });
                    addLabel(6, 12, -10, "BANK PUSAT", "Loket Pembayaran");
                }
                // Titik Pulang ke Kost
                interactZones.push({ x: 0, z: 20, radius: 5, type: 'transit_kost' });
                addLabel(0, 2, 20, "KE GANG KOST", "Pulang");
            }
        }

        // Fungsi Helper untuk memunculkan Label UI di atas bangunan
        function addLabel(x, y, z, title, sub) {
            const container = document.getElementById('labels-container');
            const el = document.createElement('div');
            el.className = 'bldg-label';
            el.innerHTML = `${title}<br><span>${sub}</span>`;
            container.appendChild(el);
            uiLabels.push({ element: el, pos: new THREE.Vector3(x, y, z) });
        }

        function startGame() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            gameState.isPlaying = true; requestAnimationFrame(gameLoop);
        }

        function loadAssets() {
            const loader = new THREE.GLTFLoader();
            
            // Memuat lebih banyak variasi dari repo mu
            const assetsToLoad = [
                { id: 'player', path: './assets/models/Isman.glb' },
                { id: 'path', path: './assets/models/path-long.glb' },
                { id: 'fence', path: './assets/models/fence.glb' },
                { id: 'tree1', path: './assets/models/tree-large.glb' },
                { id: 'tree2', path: './assets/models/tree-small.glb' },
                { id: 'b_kost', path: './assets/models/building-type-i.glb', job: 'kost', name: 'Kost Sempit' },
                { id: 'b_mart', path: './assets/models/building-type-j.glb', job: 'minimarket', name: 'Minimarket' },
                { id: 'b_office', path: './assets/models/building-type-k.glb', job: 'bank', name: 'Bank' },
                { id: 'b_house1', path: './assets/models/building-type-a.glb', job: 'none' },
                { id: 'b_house2', path: './assets/models/building-type-b.glb', job: 'none' },
                { id: 'b_house3', path: './assets/models/building-type-c.glb', job: 'none' }
            ];

            let loadedModels = {};
            let loadedCount = 0;

            assetsToLoad.forEach(asset => {
                document.getElementById('loading-detail').innerText = `Mengunduh: ${asset.path.split('/').pop()}`;
                
                loader.load(asset.path, (gltf) => {
                    const model = gltf.scene;
                    model.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; }});
                    
                    if(asset.id === 'player') {
                        ismanMesh = model;
                        ismanMesh.scale.set(0.7, 0.7, 0.7); // Karakter dikecilkan agar gedung terlihat lebih besar
                        scene.add(ismanMesh);
                        
                        // Deteksi Animasi Pintar
                        if(gltf.animations && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(ismanMesh);
                            let findIdle = null; let findWalk = null;
                            
                            gltf.animations.forEach(clip => {
                                const clipName = clip.name.toLowerCase();
                                if(clipName.includes('idle')) findIdle = mixer.clipAction(clip);
                                if(clipName.includes('walk') || clipName.includes('run')) findWalk = mixer.clipAction(clip);
                            });

                            characterActions['idle'] = findIdle || mixer.clipAction(gltf.animations[0]);
                            characterActions['walk'] = findWalk || characterActions['idle'];
                            
                            activeAction = characterActions['idle'];
                            activeAction.play();
                        }
                    } else {
                        loadedModels[asset.id] = { model: model, data: asset };
                    }

                    loadedCount++;
                    document.getElementById('loading-progress').innerText = Math.floor((loadedCount / assetsToLoad.length) * 100) + '%';
                    
                    if(loadedCount === assetsToLoad.length) {
                        buildDenseCity(loadedModels);
                        setTimeout(startGame, 500);
                    }
                }, undefined, (error) => {
                    console.error("Gagal memuat:", asset.path, error);
                    loadedCount++; // Lewati jika error agar game tetap jalan
                    if(loadedCount === assetsToLoad.length) setTimeout(startGame, 500);
                });
            });
        }

        // GENERATOR KOTA KUMUH & PADAT
        function buildDenseCity(models) {
            const frontBuildings = ['b_kost', 'b_mart', 'b_office', 'b_house1', 'b_house2'];
            const backBuildings = ['b_house1', 'b_house2', 'b_house3', 'b_office']; // Gedung tinggi belakang
            
            let zPos = 20; // Mulai dari depan karakter
            
            for(let i=0; i<35; i++) { 
                // 1. TUMPuk JALANAN (Path-long.glb) agar ada tekstur 3D di tengah
                if(models['path']) {
                    let pathObj = models['path'].model.clone();
                    pathObj.scale.set(2.5, 1, 2.5); // Perlebar sedikit
                    pathObj.position.set(0, 0.01, zPos);
                    scene.add(pathObj);
                }

                // 2. LAPISAN DEPAN (KIRI & KANAN) SANGAT RAPAT KE JALAN
                let randLeft = frontBuildings[Math.floor(Math.random() * frontBuildings.length)];
                if (models[randLeft]) {
                    let bLeft = models[randLeft].model.clone();
                    bLeft.scale.set(3, 3, 3); 
                    bLeft.position.set(-3.5, 0, zPos); // Dari 11 maju jadi -3.5 (Sangat Sempit)
                    bLeft.rotation.y = Math.PI / 2; 
                    scene.add(bLeft);

                    if(models[randLeft].data.job && models[randLeft].data.job !== 'none') {
                        interactZones.push({ x: -3.5, z: zPos, radius: 4, name: models[randLeft].data.name, type: models[randLeft].data.job });
                    }
                }

                let randRight = frontBuildings[Math.floor(Math.random() * frontBuildings.length)];
                if (models[randRight]) {
                    let bRight = models[randRight].model.clone();
                    bRight.scale.set(3, 3, 3);
                    bRight.position.set(3.5, 0, zPos); // Sangat dekat
                    bRight.rotation.y = -Math.PI / 2; 
                    scene.add(bRight);

                    if(models[randRight].data.job && models[randRight].data.job !== 'none') {
                        interactZones.push({ x: 3.5, z: zPos, radius: 4, name: models[randRight].data.name, type: models[randRight].data.job });
                    }
                }

                // 3. LAPISAN BELAKANG (PARALLAX GEDUNG TINGGI)
                if(i % 2 === 0) { // Muncul selang-seling agar tidak terlalu beraturan
                    let randBack = backBuildings[Math.floor(Math.random() * backBuildings.length)];
                    if(models[randBack]) {
                        let bBackL = models[randBack].model.clone();
                        bBackL.scale.set(5, 7, 5); // Lebih Tinggi
                        bBackL.position.set(-10, 0, zPos - 2); 
                        scene.add(bBackL);

                        let bBackR = models[randBack].model.clone();
                        bBackR.scale.set(5, 6, 5);
                        bBackR.position.set(10, 0, zPos + 2);
                        scene.add(bBackR);
                    }
                }

                // 4. DEKORASI (Pagar & Pohon) di sela-sela
                if(models['fence'] && Math.random() > 0.5) {
                    let fence = models['fence'].model.clone();
                    fence.position.set(-2.5, 0, zPos + 3);
                    scene.add(fence);
                }
                if(models['tree1'] && Math.random() > 0.7) {
                    let tree = models['tree1'].model.clone();
                    tree.scale.set(2,2,2);
                    tree.position.set(2.8, 0, zPos + 4);
                    scene.add(tree);
                }

                zPos -= 7; // Jarak Z antar gedung dipadatkan dari 14 ke 7!
            }
        }

        function startGame() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            gameState.isPlaying = true;
            requestAnimationFrame(gameLoop);
        }

        // Joystick Logic
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        const maxJoy = 45; // Sedikit dilebarkan ruang geraknya

        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            if(!joystick.active) {
                const t = e.changedTouches[0];
                joystick.active = true; joystick.touchId = t.identifier;
                updateJoy(t);
            }
        }, {passive: false});

        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystick.touchId) updateJoy(e.changedTouches[i]);
            }
        }, {passive: false});
        // (Biarkan logika joystick tetap sama)
        const endJoy = e => {
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joystick.touchId) {
                    joystick.active = false; joystick.touchId = null;
                    joystick.x = 0; joystick.y = 0;
                    joyStick.style.transform = `translate(0px, 0px)`;
                }
            }
        };
        joyZone.addEventListener('touchend', endJoy); joyZone.addEventListener('touchcancel', endJoy);

        function updateJoy(t) {
            const rect = joyZone.getBoundingClientRect();
            let dx = t.clientX - (rect.left + rect.width/2);
            let dy = t.clientY - (rect.top + rect.height/2);
            let dist = Math.hypot(dx, dy);
            if(dist > maxJoy) { dx = (dx/dist)*maxJoy; dy = (dy/dist)*maxJoy; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.x = dx / maxJoy; joystick.y = dy / maxJoy;
        }

        // Action Button
        const btnAction = document.getElementById('btn-action');
        btnAction.addEventListener('touchstart', e => {
            e.preventDefault();
            if(!btnAction.classList.contains('disabled')) handleInteraction();
        }, {passive: false});

        function handleInteraction() {
            if(!activeInteractTarget) return;
            const t = activeInteractTarget;
            
            // Logika Transisi Map
            if(t.type === 'transit_kota') { changeScene('kota', 0, 15); return; }
            if(t.type === 'transit_kost') { changeScene('kost', 0, 15); return; }
            
            // Logika Bangunan
            if(t.type === 'kost') {
                if(gameState.rentDaysLeft > 0) {
                    openModal("Kamar Kost", `Tidur dan pulihkan tenaga?\nSisa sewa: ${gameState.rentDaysLeft} Hari`, [
                        { text: "Tidur Pulas", action: () => {
                            gameState.energy = 100; gameState.inGameMinutes += 8*60; // Tidur 8 jam
                            showToast("Zzz... Energi Penuh!");
                        }}, { text: "Batal", cancel: true }
                    ]);
                } else {
                    openModal("Pemilik Kost", "Mau perpanjang sewa kamar?\nTarif: Rp 300.000 untuk 30 Hari.", [
                        { text: "Sewa (Rp300k)", action: () => {
                            if(gameState.money >= 300000) {
                                gameState.money -= 300000; gameState.rentDaysLeft = 30; gameState.kostRented = true;
                                showToast("Kost berhasil disewa 30 hari!");
                            } else { showToast("Uangmu tidak cukup!"); }
                        }}, { text: "Nanti Dulu", cancel: true }
                    ]);
                }
            } else if(t.type === 'minimarket') {
                openModal("Minimarket", "Kerja Shift 8 Jam?\nGaji: Rp 75.000", [
                    { text: "Mulai Kerja", action: () => {
                        gameState.money += 75000; gameState.energy -= 35; gameState.inGameMinutes += (8*60);
                        showToast("Kerja selesai! +Rp 75.000");
                    }}, { text: "Batal", cancel: true }
                ]);
            } else if(t.type === 'bank') {
                openModal("Bank Pusat", `Loket Utang Bapak Imron\nSisa: ${formatRp(gameState.debt)}`, [
                    { text: "Cicil Rp 1 Juta", action: () => {
                        if(gameState.money >= 1000000) {
                            gameState.money -= 1000000; gameState.debt -= 1000000;
                            showToast("Utang berhasil dicicil!");
                        } else { showToast("Uang kurang!"); }
                    }}, { text: "Batal", cancel: true }
                ]);
            }
        }

        function openModal(title, desc, buttons) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            const c = document.getElementById('modal-buttons'); c.innerHTML = '';
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = `btn-generic ${b.cancel ? 'btn-cancel' : ''}`;
                btn.innerText = b.text;
                btn.onclick = () => { document.getElementById('modal-ui').style.display = 'none'; if(b.action) b.action(); };
                c.appendChild(btn);
            });
            document.getElementById('modal-ui').style.display = 'flex';
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if(!gameState.isPlaying) return;

            const dt = clock.getDelta();
            if(mixer) mixer.update(dt);

            if(ismanMesh) {
                let isMoving = false;
                if(joystick.active) {
                    // Kecepatan diperlambat (lebih berat & realistis)
                    let speed = 2.0 * dt; 
                    
                    let newX = ismanMesh.position.x + joystick.x * speed;
                    let newZ = ismanMesh.position.z + joystick.y * speed;
                    
                    // Batasan Area berdasarkan Scene agar tidak tembus bangunan
                    let xLimit = gameState.currentScene === 'kost' ? 2.0 : 6.0;
                    if(newX > -xLimit && newX < xLimit) ismanMesh.position.x = newX;
                    if(newZ > -22 && newZ < 22) ismanMesh.position.z = newZ;
                    
                    ismanMesh.rotation.y = Math.atan2(joystick.x, joystick.y);
                    isMoving = true;
                }

                if(characterActions['walk'] && characterActions['idle']) {
                    let targetAction = isMoving ? characterActions['walk'] : characterActions['idle'];
                    if (activeAction !== targetAction) {
                        activeAction.fadeOut(0.2); targetAction.reset().fadeIn(0.2).play();
                        activeAction = targetAction;
                    }
                }

                const camYOffset = 16;  // Diangkat tinggi ke atas
                const camZOffset = 12;  // Sedikit ditarik ke belakang
                
                camera.position.x += (ismanMesh.position.x - camera.position.x) * 0.1; 
                camera.position.y += ((ismanMesh.position.y + camYOffset) - camera.position.y) * 0.1;
                camera.position.z += ((ismanMesh.position.z + camZOffset) - camera.position.z) * 0.1;
                
                // Kamera menunduk tajam ke bawah mengarah sedikit ke depan karakter
                camera.lookAt(ismanMesh.position.x, ismanMesh.position.y, ismanMesh.position.z - 3);

                uiLabels.forEach(label => {
                    let vec = label.pos.clone();
                    vec.project(camera);
                    
                    // Sembunyikan label jika ada di belakang kamera
                    if(vec.z > 1) { label.element.style.opacity = 0; return; }
                    
                    let x = (vec.x *  .5 + .5) * window.innerWidth;
                    let y = (vec.y * -.5 + .5) * window.innerHeight;
                    label.element.style.left = `${x}px`;
                    label.element.style.top = `${y}px`;
                    label.element.style.opacity = 1;
                });

                // Cek Area Interaksi
                activeInteractTarget = null;
                for(let zone of interactZones) {
                    let dist = Math.hypot(ismanMesh.position.x - zone.x, ismanMesh.position.z - zone.z);
                    if(dist < zone.radius) { activeInteractTarget = zone; break; }
                }
                
                if(activeInteractTarget) {
                    btnAction.classList.remove('disabled');
                    // Teks tombol ganti otomatis
                    if(activeInteractTarget.type.includes('transit')) btnAction.innerText = "PERGI";
                    else btnAction.innerText = activeInteractTarget.type.toUpperCase();
                } else {
                    btnAction.classList.add('disabled'); btnAction.innerText = "AKSI";
                }
            }

            // Update UI & Sistem Hari Baru
            document.getElementById('ui-money').innerText = formatRp(Math.floor(gameState.money));
            document.getElementById('ui-debt').innerText = formatRp(Math.floor(gameState.debt));
            document.getElementById('energy-bar').style.width = Math.max(0, gameState.energy) + '%';
            
            gameState.inGameMinutes += dt * 0.5;
            let h = Math.floor(gameState.inGameMinutes / 60) % 24;
            let m = Math.floor(gameState.inGameMinutes % 60);
            document.getElementById('ui-clock').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            
            // Logika Pergantian Hari (Potong sewa Kost)
            if(gameState.inGameMinutes >= 24 * 60) { 
                gameState.inGameMinutes = 0; 
                gameState.day++; 
                if(gameState.rentDaysLeft > 0) gameState.rentDaysLeft--;
                else gameState.kostRented = false;
            }
            document.getElementById('ui-day').innerText = gameState.day;

            renderer.render(scene, camera);
        }
    </script>
</body>
