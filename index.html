
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kota Perantauan</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    width: 100%;
    height: 100%;
    display: block;
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 25px;
    width: 150px;
    height: 150px;
}

.btn {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 0;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 24px;
    font-weight: bold;
    -webkit-tap-highlight-color: transparent;
}

.btn:active {
    background: rgba(255,255,255,0.45);
}

#up {
    left: 50px;
    top: 0;
}

#down {
    left: 50px;
    bottom: 0;
}

#left {
    left: 0;
    top: 50px;
}

#right {
    right: 0;
    top: 50px;
}

#info {
    position: fixed;
    top: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="info">
    Kota Perantauan
</div>

<div id="controls">
    <button class="btn" id="up">▲</button>
    <button class="btn" id="down">▼</button>
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

const player = {
    x: 600,
    y: 450,
    size: 28,
    speed: 4
};

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};

function setupButton(id, direction) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        keys[direction] = true;
    });

    button.addEventListener("pointerup", function(e) {
        e.preventDefault();
        keys[direction] = false;
    });

    button.addEventListener("pointercancel", function() {
        keys[direction] = false;
    });

    button.addEventListener("pointerleave", function() {
        keys[direction] = false;
    });
}

setupButton("up", "up");
setupButton("down", "down");
setupButton("left", "left");
setupButton("right", "right");

window.addEventListener("keydown", function(e) {
    if (e.key === "ArrowUp" || e.key === "w") keys.up = true;
    if (e.key === "ArrowDown" || e.key === "s") keys.down = true;
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
});

window.addEventListener("keyup", function(e) {
    if (e.key === "ArrowUp" || e.key === "w") keys.up = false;
    if (e.key === "ArrowDown" || e.key === "s") keys.down = false;
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
});

const buildings = [
    {
        x: 100,
        y: 100,
        width: 220,
        height: 140,
        name: "KOS"
    },
    {
        x: 500,
        y: 100,
        width: 220,
        height: 140,
        name: "TOKO"
    },
    {
        x: 900,
        y: 100,
        width: 220,
        height: 140,
        name: "WARUNG"
    },
    {
        x: 100,
        y: 650,
        width: 220,
        height: 140,
        name: "RUMAH"
    },
    {
        x: 500,
        y: 650,
        width: 220,
        height: 140,
        name: "KANTOR"
    },
    {
        x: 900,
        y: 650,
        width: 220,
        height: 140,
        name: "BENGKEL"
    }
];

function update() {

    if (keys.up) player.y -= player.speed;
    if (keys.down) player.y += player.speed;
    if (keys.left) player.x -= player.speed;
    if (keys.right) player.x += player.speed;

    player.x = Math.max(20, Math.min(1180, player.x));
    player.y = Math.max(20, Math.min(880, player.y));
}

function drawBuilding(building, cameraX, cameraY) {

    const x = building.x - cameraX;
    const y = building.y - cameraY;

    ctx.fillStyle = "#d8d8d8";
    ctx.fillRect(x, y, building.width, building.height);

    ctx.fillStyle = "#555";
    ctx.fillRect(x, y, building.width, 35);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        building.name,
        x + building.width / 2,
        y + 25
    );

    ctx.fillStyle = "#777";
    ctx.fillRect(
        x + building.width / 2 - 25,
        y + building.height - 55,
        50,
        55
    );

    ctx.fillStyle = "#9bd3ff";

    ctx.fillRect(
        x + 25,
        y + 55,
        55,
        45
    );

    ctx.fillRect(
        x + building.width - 80,
        y + 55,
        55,
        45
    );
}

function draw() {

    const cameraX = player.x - width / 2;
    const cameraY = player.y - height / 2;

    ctx.clearRect(0, 0, width, height);

    // tanah
    ctx.fillStyle = "#72a95b";
    ctx.fillRect(0, 0, width, height);

    // jalan horizontal
    ctx.fillStyle = "#555";
    ctx.fillRect(
        0,
        350 - cameraY,
        width,
        130
    );

    // jalan vertikal
    ctx.fillRect(
        390 - cameraX,
        0,
        130,
        height
    );

    // garis jalan
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 4;
    ctx.setLineDash([25, 20]);

    ctx.beginPath();
    ctx.moveTo(0, 415 - cameraY);
    ctx.lineTo(width, 415 - cameraY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(455 - cameraX, 0);
    ctx.lineTo(455 - cameraX, height);
    ctx.stroke();

    ctx.setLineDash([]);

    for (const building of buildings) {
        drawBuilding(building, cameraX, cameraY);
    }

    // player
    const px = player.x - cameraX;
    const py = player.y - cameraY;

    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(px, py - 18, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#1976d2";
    ctx.fillRect(
        px - 12,
        py - 8,
        24,
        30
    );

    ctx.fillStyle = "#222";
    ctx.fillRect(
        px - 15,
        py + 22,
        10,
        15
    );

    ctx.fillRect(
        px + 5,
        py + 22,
        10,
        15
    );
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
