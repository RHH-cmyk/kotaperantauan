<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kota Perantauan</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#controls {
    position: fixed;
    left: 25px;
    bottom: 25px;
    width: 150px;
    height: 150px;
    z-index: 10;
}

.btn {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.35);
    color: white;
    font-size: 22px;
    font-weight: bold;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
}

.btn:active {
    background: rgba(0,0,0,.6);
}

#up {
    left: 50px;
    top: 0;
}

#down {
    left: 50px;
    bottom: 0;
}

#left {
    left: 0;
    top: 50px;
}

#right {
    right: 0;
    top: 50px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="controls">
    <button class="btn" id="up">▲</button>
    <button class="btn" id="down">▼</button>
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scene = new Image();
scene.src = "scene1-kost.png";

const playerImage = new Image();
playerImage.src = "player.png";


function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/*
==================================================
SCENE
==================================================
*/

const world = {
    width: 1200,
    height: 900
};


/*
==================================================
PLAYER
==================================================
*/

const player = {

    x: 600,
    y: 675,

    speed: 3,

    width: 90,
    height: 180,

    direction: 0,

    frame: 0,
    frameTimer: 0,

    moving: false

};


/*
==================================================
CONTROL
==================================================
*/

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};


function button(id, key) {

    const el = document.getElementById(id);

    el.addEventListener("pointerdown", function(e) {

        e.preventDefault();
        keys[key] = true;

    });

    el.addEventListener("pointerup", function(e) {

        e.preventDefault();
        keys[key] = false;

    });

    el.addEventListener("pointercancel", function() {

        keys[key] = false;

    });

    el.addEventListener("pointerleave", function() {

        keys[key] = false;

    });

}


button("up", "up");
button("down", "down");
button("left", "left");
button("right", "right");


/*
==================================================
KEYBOARD
==================================================
*/

window.addEventListener("keydown", function(e) {

    if (e.key === "ArrowUp" || e.key === "w")
        keys.up = true;

    if (e.key === "ArrowDown" || e.key === "s")
        keys.down = true;

    if (e.key === "ArrowLeft" || e.key === "a")
        keys.left = true;

    if (e.key === "ArrowRight" || e.key === "d")
        keys.right = true;

});


window.addEventListener("keyup", function(e) {

    if (e.key === "ArrowUp" || e.key === "w")
        keys.up = false;

    if (e.key === "ArrowDown" || e.key === "s")
        keys.down = false;

    if (e.key === "ArrowLeft" || e.key === "a")
        keys.left = false;

    if (e.key === "ArrowRight" || e.key === "d")
        keys.right = false;

});


/*
==================================================
COLLISION AREA
==================================================

Area kost dibuat tidak bisa dimasuki.
Nanti kita bisa atur lebih presisi setelah
melihat posisi player di scene.
*/

const blockedAreas = [

    {
        x: 250,
        y: 100,
        width: 700,
        height: 430
    }

];


function isBlocked(x, y) {

    for (const area of blockedAreas) {

        if (
            x > area.x &&
            x < area.x + area.width &&
            y > area.y &&
            y < area.y + area.height
        ) {

            return true;

        }

    }

    return false;

}


/*
==================================================
UPDATE PLAYER
==================================================
*/

function update() {

    let dx = 0;
    let dy = 0;


    if (keys.up)
        dy -= 1;

    if (keys.down)
        dy += 1;

    if (keys.left)
        dx -= 1;

    if (keys.right)
        dx += 1;


    player.moving =
        dx !== 0 ||
        dy !== 0;


    if (!player.moving) {

        player.frame = 0;
        player.frameTimer = 0;

        return;

    }


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    dx /= length;
    dy /= length;


    let newX =
        player.x +
        dx * player.speed;


    let newY =
        player.y +
        dy * player.speed;


    if (!isBlocked(newX, player.y)) {
        player.x = newX;
    }


    if (!isBlocked(player.x, newY)) {
        player.y = newY;
    }


    /*
    Arah karakter
    */

    if (
        dy > 0 &&
        Math.abs(dy) >= Math.abs(dx)
    ) {

        player.direction = 0;

    }

    else if (
        dx < 0 &&
        Math.abs(dx) > Math.abs(dy)
    ) {

        player.direction = 1;

    }

    else if (
        dy < 0 &&
        Math.abs(dy) >= Math.abs(dx)
    ) {

        player.direction = 2;

    }

    else if (
        dx > 0 &&
        Math.abs(dx) > Math.abs(dy)
    ) {

        player.direction = 3;

    }


    /*
    Animasi
    */

    player.frameTimer++;


    if (player.frameTimer >= 8) {

        player.frameTimer = 0;

        player.frame++;

        if (player.frame >= 8) {
            player.frame = 0;
        }

    }


    /*
    Batas dunia
    */

    player.x = Math.max(
        40,
        Math.min(
            world.width - 40,
            player.x
        )
    );


    player.y = Math.max(
        40,
        Math.min(
            world.height - 20,
            player.y
        )
    );

}


/*
==================================================
DRAW SCENE
==================================================
*/

function drawScene(cameraX, cameraY) {

    if (!scene.complete) {
        return;
    }


    ctx.drawImage(
        scene,

        -cameraX,
        -cameraY,

        world.width,
        world.height
    );

}


/*
==================================================
DRAW PLAYER
==================================================
*/

function drawPlayer(cameraX, cameraY) {

    if (!playerImage.complete) {
        return;
    }


    /*
    Ambil ukuran sprite otomatis.
    8 kolom × 4 baris.
    */

    const frameWidth =
        playerImage.width / 8;

    const frameHeight =
        playerImage.height / 4;


    const sx =
        player.frame *
        frameWidth;


    const sy =
        player.direction *
        frameHeight;


    const x =
        player.x -
        cameraX -
        player.width / 2;


    const y =
        player.y -
        cameraY -
        player.height;


    ctx.drawImage(

        playerImage,

        sx,
        sy,

        frameWidth,
        frameHeight,

        x,
        y,

        player.width,
        player.height

    );

}


/*
==================================================
DRAW
==================================================
*/

function draw() {

    const cameraX =
        player.x -
        canvas.width / 2;


    const cameraY =
        player.y -
        canvas.height / 2;


    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawScene(
        cameraX,
        cameraY
    );


    drawPlayer(
        cameraX,
        cameraY
    );

}


/*
==================================================
GAME LOOP
==================================================
*/

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


scene.onload = function() {

    gameLoop();

};


scene.onerror = function() {

    alert(
        "scene1-kost.png tidak ditemukan"
    );

};

</script>

</body>
</html>
