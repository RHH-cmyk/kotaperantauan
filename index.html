<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kota Perantauan</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* JOYSTICK */

#joystick {
    position: fixed;
    left: 25px;
    bottom: 25px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background: rgba(0,0,0,.28);
    border: 3px solid rgba(255,255,255,.25);

    z-index: 20;

    touch-action: none;
}

#stick {
    position: absolute;

    width: 65px;
    height: 65px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,.55);

    border: 3px solid rgba(255,255,255,.8);

    box-shadow: 0 3px 10px rgba(0,0,0,.3);

    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="joystick">
    <div id="stick"></div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scene = new Image();
scene.src = "scene1-kost.png";

const playerImage = new Image();
playerImage.src = "player.png";


/* =========================
   CANVAS
========================= */

function resize() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);

resize();


/* =========================
   WORLD
========================= */

const world = {

    width: 1200,
    height: 900

};


/* =========================
   PLAYER
========================= */

const player = {

    x: 600,
    y: 675,

    speed: 3,

    width: 90,
    height: 180,

    direction: 0,

    frame: 0,
    frameTimer: 0,

    moving: false

};


/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


let joystickActive = false;

let joystickX = 0;
let joystickY = 0;


const joystickRadius = 75;


function updateJoystick(e) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        e.clientX -
        centerX;


    let dy =
        e.clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > joystickRadius) {

        dx =
            dx /
            distance *
            joystickRadius;

        dy =
            dy /
            distance *
            joystickRadius;

    }


    joystickX =
        dx /
        joystickRadius;


    joystickY =
        dy /
        joystickRadius;


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;

}


function resetJoystick() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.left = "50%";
    stick.style.top = "50%";

}


joystick.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        joystickActive = true;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);

    }
);


joystick.addEventListener(
    "pointermove",
    function(e) {

        if (!joystickActive) {
            return;
        }

        e.preventDefault();

        updateJoystick(e);

    }
);


joystick.addEventListener(
    "pointerup",
    function(e) {

        e.preventDefault();

        resetJoystick();

    }
);


joystick.addEventListener(
    "pointercancel",
    function() {

        resetJoystick();

    }
);


/* =========================
   KEYBOARD
========================= */

const keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key === "w"
        ) {
            keys.up = true;
        }

        if (
            e.key === "ArrowDown" ||
            e.key === "s"
        ) {
            keys.down = true;
        }

        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {
            keys.left = true;
        }

        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {
            keys.right = true;
        }

    }
);


window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key === "w"
        ) {
            keys.up = false;
        }

        if (
            e.key === "ArrowDown" ||
            e.key === "s"
        ) {
            keys.down = false;
        }

        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {
            keys.left = false;
        }

        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {
            keys.right = false;
        }

    }
);


/* =========================
   COLLISION
========================= */

const blockedAreas = [

    {
        x: 250,
        y: 100,
        width: 700,
        height: 430
    }

];


function isBlocked(x, y) {

    for (
        const area
        of blockedAreas
    ) {

        if (
            x > area.x &&
            x < area.x + area.width &&
            y > area.y &&
            y < area.y + area.height
        ) {

            return true;

        }

    }

    return false;

}


/* =========================
   UPDATE
========================= */

function update() {

    let dx = 0;
    let dy = 0;


    /* JOYSTICK */

    if (joystickActive) {

        dx += joystickX;
        dy += joystickY;

    }


    /* KEYBOARD */

    if (keys.up)
        dy -= 1;

    if (keys.down)
        dy += 1;

    if (keys.left)
        dx -= 1;

    if (keys.right)
        dx += 1;


    player.moving =
        Math.abs(dx) > 0.08 ||
        Math.abs(dy) > 0.08;


    if (!player.moving) {

        player.frame = 0;
        player.frameTimer = 0;

        return;

    }


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 1) {

        dx /= length;
        dy /= length;

    }


    let newX =
        player.x +
        dx * player.speed;


    let newY =
        player.y +
        dy * player.speed;


    if (
        !isBlocked(
            newX,
            player.y
        )
    ) {

        player.x = newX;

    }


    if (
        !isBlocked(
            player.x,
            newY
        )
    ) {

        player.y = newY;

    }


    /* ARAH */

    if (
        Math.abs(dx) >
        Math.abs(dy)
    ) {

        if (dx > 0) {

            player.direction = 3;

        } else {

            player.direction = 1;

        }

    }

    else {

        if (dy > 0) {

            player.direction = 0;

        } else {

            player.direction = 2;

        }

    }


    /* ANIMASI */

    player.frameTimer++;


    if (
        player.frameTimer >= 8
    ) {

        player.frameTimer = 0;

        player.frame++;


        if (
            player.frame >= 8
        ) {

            player.frame = 0;

        }

    }


    /* BATAS MAP */

    player.x =
        Math.max(
            40,
            Math.min(
                world.width - 40,
                player.x
            )
        );


    player.y =
        Math.max(
            40,
            Math.min(
                world.height - 20,
                player.y
            )
        );

}


/* =========================
   DRAW SCENE
========================= */

function drawScene(
    cameraX,
    cameraY
) {

    if (!scene.complete) {
        return;
    }


    ctx.drawImage(

        scene,

        -cameraX,
        -cameraY,

        world.width,
        world.height

    );

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(
    cameraX,
    cameraY
) {

    if (!playerImage.complete) {
        return;
    }


    const frameWidth =
        playerImage.width / 8;


    const frameHeight =
        playerImage.height / 4;


    const sx =
        player.frame *
        frameWidth;


    const sy =
        player.direction *
        frameHeight;


    const x =
        player.x -
        cameraX -
        player.width / 2;


    const y =
        player.y -
        cameraY -
        player.height;


    ctx.drawImage(

        playerImage,

        sx,
        sy,

        frameWidth,
        frameHeight,

        x,
        y,

        player.width,
        player.height

    );

}


/* =========================
   DRAW
========================= */

function draw() {

    const cameraX =
        player.x -
        canvas.width / 2;


    const cameraY =
        player.y -
        canvas.height / 2;


    ctx.fillStyle = "#111";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawScene(
        cameraX,
        cameraY
    );


    drawPlayer(
        cameraX,
        cameraY
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
