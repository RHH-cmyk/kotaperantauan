<script type="module">

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.insertBefore(renderer.domElement,status);
scene.add(new THREE.HemisphereLight(0xffe8c8,0x393b35,2.0));const sun=new THREE.DirectionalLight(0xffd9a2,2.0);sun.position.set(-12,22,8);scene.add(sun);
const manager=new THREE.LoadingManager();
manager.setURLModifier(url=>{const clean=decodeURIComponent(url.split('?')[0]);if(/\.(png|jpe?g|webp|ktx2?)$/i.test(clean)){const name=clean.split('/').pop();return './assets/models/textures/'+name;}return url;});

 ground(150,130,0,0,M.earth,-.42);

function addAsset(file,x,y,z,height,rotation=0,collision=null,folder=''){

function shack(cx,cz,w=5.0,d=4.5,h=3.0,variant=0){
 const front=cz<0?1:-1;const wallFiles=['wall-a-flat.glb','wall-a-flat-painted.glb','wall-b-flat.glb','wall-a-flat-window.glb','wall-b-flat-window.glb'];
 const doorFiles=['wall-a-door.glb','wall-b-door.glb'];
 const roofFiles=['wall-a-roof.glb','wall-a-roof-detailed.glb','wall-a-roof-slant.glb','wall-b-roof.glb','roof-metal-type-a.glb','roof-metal-type-b.glb'];
 const n=Math.max(2,Math.round(w/1.75));const step=w/n;
 for(let i=0;i<n;i++){
   const x=cx-w/2+step*(i+.5);let f=(i===Math.floor(n/2)&&variant%3===0)?doorFiles[variant%2]:wallFiles[(i+variant)%wallFiles.length];
   addAsset(f,x,0,cz+front*d/2,h,front===1?0:Math.PI);
 }
 // side walls close the shack and make an irregular alley silhouette
 const sideCount=Math.max(2,Math.round(d/1.8));for(const s of [-1,1])for(let i=0;i<sideCount;i++){
   const z=cz-d/2+(i+.5)*(d/sideCount);addAsset(wallFiles[(i+variant+(s===1?1:2))%wallFiles.length],cx+s*w/2,0,z,h,s===1?Math.PI/2:-Math.PI/2);
 }
 // back wall
 for(let i=0;i<n;i++){const x=cx-w/2+step*(i+.5);addAsset(wallFiles[(i+variant+2)%wallFiles.length],x,0,cz-front*d/2,h,front===1?Math.PI:0)}
 // roof sheets slightly overhang the walls; mix metal and weathered wooden pieces
 addAsset(roofFiles[variant%roofFiles.length],cx,h*.78,cz,h*.78,variant%2?Math.PI/2:0);
 if(variant%2===0)addAsset('detail-awning-wide.glb',cx,0,cz+front*(d/2+.35),.8,front===1?0:Math.PI);
 // broken boards and dark foundation clutter around front
 block(w+.15,.18,d+.15,cx,.12,cz,M.wall);obstacle(cx,cz,w*.78,d*.78);
 if(variant%2===1){addAsset('wall-b-broken-type-a.glb',cx-w*.35,0,cz+front*(d/2+.15),1.3,0);}
}

 [-15.5,-11.3,5.2,4.7,3.3,0],[-9.8,-11.8,4.7,4.2,3.0,2],[-4.5,-11.4,4.8,4.8,3.7,1],[1.0,-11.8,5.0,4.4,3.2,3],[6.6,-11.3,4.8,4.8,3.6,4],[12.0,-11.8,5.0,4.3,3.0,5],[17.3,-11.5,4.5,4.7,3.4,2],
 [-17.0,11.6,4.8,4.4,3.0,3],[-11.5,11.9,5.1,4.8,3.6,4],[-5.8,11.4,4.7,4.4,3.1,5],[-.5,11.8,5.0,4.8,3.7,0],[5.0,11.5,4.7,4.3,3.0,1],[10.3,11.8,5.0,4.7,3.5,2],[15.8,11.4,4.8,4.3,3.0,4]

 for(let x=-18;x<=18;x+=4.5){if(Math.random()>.25)addAsset('wall-fence.glb',x,0,side*8.2,1.55,side===1?Math.PI:0,[2.0,.4]);if(Math.random()>.4)addAsset('detail-dumpster-open.glb',x+.8,0,side*7.5,1.25,Math.random()*Math.PI,[1.25,.9]);if(Math.random()>.35)addAsset('detail-bricks-type-a.glb',x-.7,0,side*6.7,.55,Math.random()*2);if(Math.random()>.5)addAsset('pallet-small.glb',x+1.2,0,side*6.6,.48,Math.random()*2);if(Math.random()>.65)addAsset('planks.glb',x,0,side*6.5,.42,Math.random()*2)}

// Isman is loaded from the character subfolder, with a root-level fallback
function loadIsman(i=0){const paths=['./assets/models/character/Isman.glb','./assets/models/Isman.glb'];if(i>=paths.length){status.textContent='Map tampil • Isman gagal dimuat';return;}loader.load(paths[i],g=>{character=g.scene;const b=new THREE.Box3().setFromObject(character),sz=b.getSize(new THREE.Vector3());if(sz.y>0)character.scale.setScalar(1.72/sz.y);character.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(character);character.position.set(0,-bb.min.y,5.7);scene.add(character);mixer=new THREE.AnimationMixer(character);const clips=g.animations||[];const wc=clips.find(c=>/walk|walking|run/i.test(c.name)),ic=clips.find(c=>/idle|stand|breath/i.test(c.name));if(wc)walkAction=mixer.clipAction(wc);if(ic)idleAction=mixer.clipAction(ic);if(idleAction){idleAction.play();activeAction=idleAction}else if(walkAction){walkAction.play();activeAction=walkAction}else if(clips.length){activeAction=mixer.clipAction(clips[0]);activeAction.play()}status.textContent='Kota Perantauan • Isman siap • 5 kost • pasar • area kerja';},undefined,()=>loadIsman(i+1));}
loadIsman();
// Floating joystick: muncul di titik sentuhan pertama, bisa pindah setiap sentuhan baru, lalu fade-out setelah dilepas.
let active=false,pid=null,jx=0,jy=0,fadeTimer=null;const STICK_RADIUS=49;function placeStick(x,y){joy.style.left=x+'px';joy.style.top=y+'px';joy.classList.add('visible');clearTimeout(fadeTimer)}function stick(e){let dx=e.clientX-parseFloat(joy.style.left),dy=e.clientY-parseFloat(joy.style.top),l=Math.hypot(dx,dy);if(l>STICK_RADIUS){dx*=STICK_RADIUS/l;dy*=STICK_RADIUS/l}jx=dx/STICK_RADIUS;jy=dy/STICK_RADIUS;knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`}function release(){active=false;pid=null;jx=jy=0;knob.style.left='50%';knob.style.top='50%';clearTimeout(fadeTimer);fadeTimer=setTimeout(()=>joy.classList.remove('visible'),1800)}document.addEventListener('pointerdown',e=>{if(e.target.closest('#status,#hint,#cameraButton,#cameraPanel'))return;if(active)return;e.preventDefault();active=true;pid=e.pointerId;placeStick(e.clientX,e.clientY);jx=jy=0;knob.style.left='50%';knob.style.top='50%'});document.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid){e.preventDefault();stick(e)}});document.addEventListener('pointerup',e=>{if(active&&e.pointerId===pid)release()});document.addEventListener('pointercancel',e=>{if(active&&e.pointerId===pid)release()});
function collides(x,z){for(const o of obstacles)if(Math.abs(x-o.x)<o.w/2+.3&&Math.abs(z-o.z)<o.d/2+.3)return true;return false}
const target=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(character){let dx=jx,dz=jy;const moving=Math.hypot(jx,jy)>.15;if(moving){if(cameraMode==='third'){const f=new THREE.Vector3(character.position.x-camera.position.x,0,character.position.z-camera.position.z).normalize();const r=new THREE.Vector3(-f.z,0,f.x);dx=r.x*jx-f.x*jy;dz=r.z*jx-f.z*jy;}const l=Math.hypot(dx,dz);dx/=Math.max(1,l);dz/=Math.max(1,l);const speed=3.3,nx=THREE.MathUtils.clamp(character.position.x+dx*speed*dt,-67,67),nz=THREE.MathUtils.clamp(character.position.z+dz*speed*dt,-57,57);if(!collides(nx,character.position.z))character.position.x=nx;if(!collides(character.position.x,nz))character.position.z=nz;character.rotation.y=Math.atan2(dx,dz);if(walkAction&&activeAction!==walkAction){if(activeAction)activeAction.fadeOut(.12);walkAction.reset().fadeIn(.12).play();activeAction=walkAction}}else if(idleAction&&activeAction!==idleAction){if(activeAction)activeAction.fadeOut(.12);idleAction.reset().fadeIn(.12).play();activeAction=idleAction}target.set(character.position.x,0,character.position.z)}if(cameraMode==='third'&&character){const desired=new THREE.Vector3(character.position.x+cameraDistance*.55, cameraHeight*.72, character.position.z+cameraDistance*.84);camera.position.lerp(desired,.12);const look=new THREE.Vector3(character.position.x,1.15,character.position.z);camera.lookAt(look)}else{const rad=THREE.MathUtils.degToRad(cameraAngle);const desired=new THREE.Vector3(target.x+cameraDistance*.62, cameraHeight, target.z+cameraDistance*Math.cos(rad));desired.z=target.z+cameraDistance*.72;camera.position.lerp(desired,.09);camera.lookAt(target)}renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);if(camera.isPerspectiveCamera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}}addEventListener('resize',resize);resize();animate();
