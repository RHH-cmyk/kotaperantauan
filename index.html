<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalibrasi Aset 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background-color: #1a1e24; color: #fff; overflow: hidden; touch-action: none; user-select: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1e24; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-text { font-family: 'Press Start 2P', cursive; color: #fbbf24; font-size: 1rem; margin-bottom: 10px; text-align: center; line-height: 1.5; }
        #loading-detail { font-family: 'Press Start 2P', cursive; color: #94a3b8; font-size: 0.6rem; }
        
        .controls-area { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2rem; pointer-events: none; position: absolute; bottom: 40px; left: 0; z-index: 10; }
        .joystick-base { width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .joystick-stick { width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div id="loading-screen">
        <div class="loading-text">MEMUAT ASET...<br><span id="loading-progress">0%</span></div>
        <div id="loading-detail">Menyelaraskan Rotasi & Skala</div>
    </div>

    <div class="controls-area">
        <div class="joystick-base" id="joystick-zone"><div class="joystick-stick" id="joystick-stick"></div></div>
    </div>

    <script>
        let scene, camera, renderer, clock, mixer;
        let ismanMesh = null;
        let activeAction = null;
        let characterActions = {};
        let globalModels = {};
        
        // SISTEM GRID BARU 
        const TILE_WIDTH = 4.0;  // Lebar jalan ke samping (X)
        const TILE_LENGTH = 5.0; // Panjang potongan jalan ke depan (Z) agar rapat

        const joystick = { active: false, x: 0, y: 0, touchId: null };

        initThreeEngine();

        function initThreeEngine() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            
            // Warna dasar tanah disamakan dengan aspal gelap, agar kalau ada celah 1mm tidak terlihat
            scene.background = new THREE.Color(0x2c303a);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2); 
            sun.position.set(20, 50, -20);
            scene.add(sun);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshStandardMaterial({ color: 0x22242b }) // Aspal kusam
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            scene.add(ground);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            clock = new THREE.Clock();
            loadAssets();
        }

        function loadAssets() {
            const loader = new THREE.GLTFLoader();
            const assetsToLoad = [
                { id: 'player', path: 'assets/models/Isman.glb' },
                { id: 'aspal', path: 'assets/models/driveway-long.glb' },
                { id: 'trotoar', path: 'assets/models/path-long.glb' },
                { id: 'rumah', path: 'assets/models/building-type-a.glb' },
                { id: 'minimarket', path: 'assets/models/building-type-j.glb' }
            ];

            let loaded = 0;
            assetsToLoad.forEach(asset => {
                loader.load(asset.path, (gltf) => {
                    if(asset.id === 'player') {
                        ismanMesh = gltf.scene;
                        ismanMesh.scale.set(0.8, 0.8, 0.8);
                        scene.add(ismanMesh);
                        
                        if(gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(ismanMesh);
                            let idleClip = gltf.animations.find(a => a.name.toLowerCase().includes('idle')) || gltf.animations[0];
                            let walkClip = gltf.animations.find(a => a.name.toLowerCase().includes('walk') || a.name.toLowerCase().includes('run')) || idleClip;
                            
                            characterActions['idle'] = mixer.clipAction(idleClip);
                            characterActions['walk'] = mixer.clipAction(walkClip);
                            activeAction = characterActions['idle'];
                            activeAction.play();
                        }
                    } else {
                        globalModels[asset.id] = gltf.scene;
                    }

                    loaded++;
                    document.getElementById('loading-progress').innerText = Math.floor((loaded / assetsToLoad.length) * 100) + '%';
                    
                    if(loaded === assetsToLoad.length) {
                        buildTestStreet();
                        document.getElementById('loading-screen').style.display = 'none';
                        requestAnimationFrame(gameLoop);
                    }
                });
            });
        }

        function buildTestStreet() {
            // Bangun jalan sepanjang 15 blok ke depan dan belakang
            for(let z = -15; z <= 15; z++) {
                let zPos = z * TILE_LENGTH; // Jarak rapat

                // 1. ASPAL TENGAH (Diputar 90 derajat = Math.PI / 2)
                if(globalModels['aspal']) {
                    let aspal = globalModels['aspal'].clone();
                    aspal.rotation.y = Math.PI / 2; // PUTAR KE DEPAN
                    // Skala X dinaikkan tajam (karena sudah diputar, X menjadi Z/panjang) agar rapat
                    aspal.scale.set(5.5, 3.0, 3.0); 
                    aspal.position.set(0, 0, zPos);
                    scene.add(aspal);
                }

                // 2. TROTOAR KIRI (Diputar 90 derajat)
                if(globalModels['trotoar']) {
                    let tk = globalModels['trotoar'].clone();
                    tk.rotation.y = Math.PI / 2;
                    tk.scale.set(5.5, 3.0, 3.0);
                    tk.position.set(-TILE_WIDTH, 0, zPos);
                    scene.add(tk);
                }

                // 3. TROTOAR KANAN (Diputar 90 derajat)
                if(globalModels['trotoar']) {
                    let ta = globalModels['trotoar'].clone();
                    ta.rotation.y = Math.PI / 2;
                    ta.scale.set(5.5, 3.0, 3.0);
                    ta.position.set(TILE_WIDTH, 0, zPos);
                    scene.add(ta);
                }
            }

            // 4. RUMAH KIRI (Pintu menghadap ke aspal)
            if(globalModels['rumah']) {
                let r1 = globalModels['rumah'].clone();
                r1.scale.set(3.0, 3.0, 3.0);
                r1.position.set(-TILE_WIDTH * 2, 0, -TILE_LENGTH); 
                r1.rotation.y = Math.PI / 2; // Putar agar menghadap jalan
                scene.add(r1);
                
                let r2 = globalModels['rumah'].clone();
                r2.scale.set(3.0, 3.0, 3.0);
                r2.position.set(-TILE_WIDTH * 2, 0, TILE_LENGTH * 2); 
                r2.rotation.y = Math.PI / 2;
                scene.add(r2);
            }

            // 5. MINIMARKET KANAN (Pintu menghadap ke aspal)
            if(globalModels['minimarket']) {
                let m1 = globalModels['minimarket'].clone();
                m1.scale.set(3.0, 3.0, 3.0);
                m1.position.set(TILE_WIDTH * 2, 0, 0); 
                m1.rotation.y = -Math.PI / 2; // Putar arah sebaliknya
                scene.add(m1);
            }
        }

        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        const maxJoy = 35; 

        joyZone.addEventListener('touchstart', e => { e.preventDefault(); joystick.active = true; joystick.touchId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); }, {passive: false});
        joyZone.addEventListener('touchmove', e => { e.preventDefault(); for(let t of e.changedTouches) if(t.identifier === joystick.touchId) updateJoy(t); }, {passive: false});
        const endJoy = e => { for(let t of e.changedTouches) if(t.identifier === joystick.touchId) { joystick.active = false; joyStick.style.transform = `translate(0,0)`; joystick.x=0; joystick.y=0; } };
        joyZone.addEventListener('touchend', endJoy); joyZone.addEventListener('touchcancel', endJoy);

        function updateJoy(t) {
            const rect = joyZone.getBoundingClientRect();
            let dx = t.clientX - (rect.left + rect.width/2);
            let dy = t.clientY - (rect.top + rect.height/2);
            let dist = Math.hypot(dx, dy);
            if(dist > maxJoy) { dx = (dx/dist)*maxJoy; dy = (dy/dist)*maxJoy; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.x = dx / maxJoy; joystick.y = dy / maxJoy;
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const dt = clock.getDelta();
            
            if(mixer) mixer.update(dt);

            if(ismanMesh) {
                let isMoving = false;
                if(joystick.active) {
                    let speed = 4.0 * dt; 
                    ismanMesh.position.x += joystick.x * speed;
                    ismanMesh.position.z += joystick.y * speed;
                    ismanMesh.rotation.y = Math.atan2(joystick.x, joystick.y);
                    isMoving = true;
                }

                if(characterActions['walk'] && characterActions['idle']) {
                    let targetAction = isMoving ? characterActions['walk'] : characterActions['idle'];
                    if (activeAction !== targetAction) {
                        activeAction.fadeOut(0.2); targetAction.reset().fadeIn(0.2).play();
                        activeAction = targetAction;
                    }
                }

                // Kamera Isometric Nyaman (Atas-Belakang)
                camera.position.x += (ismanMesh.position.x - camera.position.x) * 0.1;
                camera.position.y = ismanMesh.position.y + 12; // Tinggi
                camera.position.z += (ismanMesh.position.z + 12 - camera.position.z) * 0.1; // Mundur
                camera.lookAt(ismanMesh.position.x, ismanMesh.position.y, ismanMesh.position.z);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
