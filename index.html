
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kota Perantauan - Scene 1</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #252a2b;
  touch-action: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 5;
  max-width: 75%;
  padding: 9px 12px;
  color: white;
  background: #18201dd9;
  border-radius: 8px;
  font: 12px Arial, sans-serif;
  pointer-events: none;
}
#joy {
  position: fixed;
  left: 24px;
  bottom: 28px;
  width: 142px;
  height: 142px;
  border: 3px solid #ffffff55;
  background: #1119;
  border-radius: 50%;
  z-index: 10;
  touch-action: none;
}
#knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 62px;
  height: 62px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 3px solid #fff;
  background: #b9b9b9c9;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="status">Memuat scene...</div>
<div id="joy"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const status = document.getElementById("status");
const joy = document.getElementById("joy");
const knob = document.getElementById("knob");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#9da9a7");
scene.fog = new THREE.Fog("#9da9a7", 35, 75);

const camera = new THREE.OrthographicCamera(
  -10, 10, 10, -10, 0.1, 150
);

camera.position.set(15, 19, 17);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "low-power"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.insertBefore(renderer.domElement, status);

scene.add(new THREE.HemisphereLight(0xffffff, 0x69745c, 2));

const sunlight = new THREE.DirectionalLight(0xffedcf, 2.2);
sunlight.position.set(-8, 18, 10);
scene.add(sunlight);

const loader = new GLTFLoader();
const base = "./assets/models/";

const mats = {
  grass: new THREE.MeshStandardMaterial({color: "#78866a", roughness: 1}),
  asphalt: new THREE.MeshStandardMaterial({color: "#454849", roughness: 1}),
  sidewalk: new THREE.MeshStandardMaterial({color: "#a9a49a", roughness: 1}),
  gutter: new THREE.MeshStandardMaterial({color: "#4c5554", roughness: 1}),
  concrete: new THREE.MeshStandardMaterial({color: "#88877c", roughness: 1})
};

function slab(w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), material
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  return mesh;
}

/* LINGKUNGAN */
slab(44, 0.25, 38, mats.grass, 0, -0.16, 0);

/* Jalan depan kost */
slab(44, 0.12, 8, mats.asphalt, 0, -0.025, 12);

/* Trotoar */
slab(44, 0.20, 2.5, mats.sidewalk, 0, 0.02, 7);

/* Got di antara halaman dan trotoar */
slab(44, 0.15, 0.65, mats.gutter, 0, -0.01, 8.55);

/* Bibir beton got */
slab(44, 0.20, 0.13, mats.concrete, 0, 0.06, 8.18);
slab(44, 0.20, 0.13, mats.concrete, 0, 0.06, 8.92);

/* Garis pembatas jalan */
for (let x = -20; x < 21; x += 5) {
  slab(2.1, 0.025, 0.12, mats.sidewalk, x, 0.045, 12);
}

/* Lantai halaman kost */
slab(18, 0.12, 7, mats.sidewalk, 0, -0.01, 3.6);

/* Ubin sederhana */
const tileMat = new THREE.MeshStandardMaterial({color: "#c1b9a8"});
for (let x = -8; x <= 8; x += 1.5) {
  for (let z = 1; z <= 6; z += 1.5) {
    slab(1.35, 0.025, 1.35, tileMat, x, 0.065, z);
  }
}

/* Objek dan model */
const obstacles = [];
let character = null;
let mixer = null;
let walkAction = null;
let idleAction = null;
let activeAction = null;
let loadedCount = 0;
let failedCount = 0;

function boxObstacle(x, z, w, d) {
  obstacles.push({x, z, w, d});
}

function addFence(x, z, length, rotation = 0) {
  loader.load(base + "fence-1x4.glb", gltf => {
    const obj = gltf.scene;
    fitModel(obj, length, 1.3, 0.35);
    obj.position.set(x, 0, z);
    obj.rotation.y = rotation;
    scene.add(obj);
  }, undefined, () => {});
}

function fitModel(obj, targetX, targetY, targetZ) {
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj);
  const size = b.getSize(new THREE.Vector3());

  if (size.x < 0.0001 || size.y < 0.0001 || size.z < 0.0001) {
    return;
  }

  obj.scale.set(
    targetX / size.x,
    targetY / size.y,
    targetZ / size.z
  );
  obj.updateMatrixWorld(true);

  const fitted = new THREE.Box3().setFromObject(obj);
  obj.position.y -= fitted.min.y;
}

function loadProp(file, position, size, collision = null) {
  loader.load(base + file, gltf => {
    const obj = gltf.scene;
    fitModel(obj, size[0], size[1], size[2]);
    obj.position.set(position[0], 0, position[1]);
    scene.add(obj);

    if (collision) {
      boxObstacle(position[0], position[1], collision[0], collision[1]);
    }
    loadedCount++;
  }, undefined, () => {
    failedCount++;
    console.warn("Gagal memuat model:", file);
  });
}

/* Kost: model bangunan dari bundle */
loadProp("building-type-a.glb", [0, 0], [12, 4.8, 6]);

/* Tanaman dan pagar */
loadProp("planter.glb", [-7, 3], [1.5, 0.6, 0.7]);
loadProp("planter.glb", [7, 3], [1.5, 0.6, 0.7]);

addFence(-5, 5.5, 4);
addFence(5, 5.5, 4);

/* Karakter Isman */
loader.load(base + "Isman.glb", gltf => {
  character = gltf.scene;

  const b = new THREE.Box3().setFromObject(character);
  const size = b.getSize(new THREE.Vector3());

  if (size.y > 0) {
    const scale = 1.75 / size.y;
    character.scale.setScalar(scale);
  }

  character.updateMatrixWorld(true);
  const fitted = new THREE.Box3().setFromObject(character);
  character.position.y -= fitted.min.y;

  character.position.set(0, 0, 6.1);
  scene.add(character);

  mixer = new THREE.AnimationMixer(character);

  const clips = gltf.animations || [];
  const idleClip = clips.find(c => /idle|stand/i.test(c.name));
  const walkClip = clips.find(c => /walk|walking/i.test(c.name));

  if (idleClip) idleAction = mixer.clipAction(idleClip);
  if (walkClip) walkAction = mixer.clipAction(walkClip);

  if (idleAction) {
    idleAction.play();
    activeAction = idleAction;
  } else if (walkAction) {
    walkAction.play();
    activeAction = walkAction;
  }

  loadedCount++;
  status.textContent =
    "Isman siap • Animasi: " + clips.length;
}, undefined, error => {
  status.textContent = "Gagal memuat Isman.glb";
  console.error(error);
});

/* Zona terlarang: kost, got, jalan */
boxObstacle(0, 0, 12, 5);
boxObstacle(0, 8.55, 44, 0.7);
boxObstacle(0, 12, 44, 8);

/* JOYSTICK */
let joyActive = false;
let joyX = 0;
let joyY = 0;
let pointerId = null;

function moveStick(e) {
  const r = joy.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const max = 49;
  const len = Math.hypot(dx, dy);

  if (len > max) {
    dx *= max / len;
    dy *= max / len;
  }

  joyX = dx / max;
  joyY = dy / max;
  knob.style.left = `calc(50% + ${dx}px)`;
  knob.style.top = `calc(50% + ${dy}px)`;
}

function releaseStick() {
  joyActive = false;
  pointerId = null;
  joyX = 0;
  joyY = 0;
  knob.style.left = "50%";
  knob.style.top = "50%";
}

joy.addEventListener("pointerdown", e => {
  e.preventDefault();
  joyActive = true;
  pointerId = e.pointerId;
  joy.setPointerCapture(pointerId);
  moveStick(e);
});

joy.addEventListener("pointermove", e => {
  if (joyActive && e.pointerId === pointerId) {
    e.preventDefault();
    moveStick(e);
  }
});

joy.addEventListener("pointerup", releaseStick);
joy.addEventListener("pointercancel", releaseStick);

/* Collision sederhana pada posisi kaki */
function collides(x, z) {
  for (const o of obstacles) {
    if (
      Math.abs(x - o.x) < o.w / 2 + 0.25 &&
      Math.abs(z - o.z) < o.d / 2 + 0.25
    ) return true;
  }
  return false;
}

const clock = new THREE.Clock();
const target = new THREE.Vector3(0, 0, 0);

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  if (mixer) mixer.update(dt);

  if (character) {
    let dx = joyX;
    let dz = joyY;

    const moving = Math.hypot(dx, dz) > 0.15;

    if (moving) {
      const len = Math.hypot(dx, dz);
      dx /= Math.max(1, len);
      dz /= Math.max(1, len);

      const speed = 3.0;
      const nx = character.position.x + dx * speed * dt;
      const nz = character.position.z + dz * speed * dt;

      if (!collides(nx, character.position.z)) {
        character.position.x = THREE.MathUtils.clamp(nx, -19, 19);
      }
      if (!collides(character.position.x, nz)) {
        character.position.z = THREE.MathUtils.clamp(nz, 9.5, 16);
      }

      character.rotation.y = Math.atan2(dx, dz);

      if (walkAction && activeAction !== walkAction) {
        if (activeAction) activeAction.fadeOut(0.15);
        walkAction.reset().fadeIn(0.15).play();
        activeAction = walkAction;
      }
    } else if (idleAction && activeAction !== idleAction) {
      if (activeAction) activeAction.fadeOut(0.15);
      idleAction.reset().fadeIn(0.15).play();
      activeAction = idleAction;
    }

    target.set(
      character.position.x,
      0,
      character.position.z
    );
  }

  camera.position.x = THREE.MathUtils.lerp(
    camera.position.x, target.x + 15, 0.08
  );
  camera.position.z = THREE.MathUtils.lerp(
    camera.position.z, target.z + 17, 0.08
  );
  camera.lookAt(target);

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);

  const aspect = window.innerWidth / window.innerHeight;
  const view = 10;

  camera.left = -view * aspect;
  camera.right = view * aspect;
  camera.top = view;
  camera.bottom = -view;
  camera.updateProjectionMatrix();
});

const aspect = window.innerWidth / window.innerHeight;
camera.left = -10 * aspect;
camera.right = 10 * aspect;
camera.top = 10;
camera.bottom = -10;
camera.updateProjectionMatrix();

animate();
</script>
</body>
</html>
